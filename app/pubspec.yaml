name: today_meal
description: 말로 관리하는 우리 집 냉장고 — 핸드폰에서 재고를 기록하고 오늘의 메뉴를 정한다.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter

  # 음성 계층.
  #
  # 호출어 감지는 sherpa-onnx 의 온디바이스 한국어 스트리밍 ASR 로 한다. Porcupine 은
  # 무료 티어가 종료돼 쓸 수 없다 — 근거는 docs/design/0001 의 「웨이크워드」에 있다.
  #
  # 전사와 낭독은 기기 내장 서비스를 감싼 것이라 기기별 동작 차이가 그대로 올라온다.
  sherpa_onnx: ^1.13.8
  speech_to_text: ^7.5.0
  flutter_tts: ^4.2.5
  permission_handler: ^12.0.0
  path_provider: ^2.1.5
  record: ^6.1.1

  # 네트워크
  dio: ^5.9.0
  json_annotation: ^4.9.0

  # 상태와 DI. ViewModel 은 ChangeNotifier 이고 주입은 get_it 이 한다.
  provider: ^6.1.5
  get_it: ^8.0.3

  # 설정과 유틸
  flutter_dotenv: ^5.2.1
  uuid: ^4.5.1
  intl: ^0.20.2
  logger: ^2.5.0

  # 화면을 켜 둔 상태로 유지한다. 조리 모드에서만 켠다.
  wakelock_plus: ^1.2.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.14
  json_serializable: ^6.9.5
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  assets:
    - .env
    # 온디바이스 한국어 스트리밍 ASR 모델. 약 134MB 로 앱에 번들한다 —
    # 시연에서 네트워크 없이 떠야 하므로 내려받기에 기대지 않는다.
    - assets/asr/
