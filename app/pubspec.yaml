name: today_meal
description: 말로 관리하는 우리 집 냉장고 — 핸드폰에서 재고를 기록하고 오늘의 메뉴를 정한다.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter

  # 음성 계층.
  #
  # 호출어 감지·전사·낭독을 모두 기기 내장 서비스로 한다. Porcupine 은 무료 티어가
  # 종료됐고, sherpa-onnx 는 실기기에서 모델 로드 중 프로세스가 죽었다 — 근거는
  # docs/design/0001 의 「웨이크워드」에 있다.
  #
  # 기기 내장 서비스를 감싼 것이라 기기별 동작 차이가 그대로 올라온다.
  speech_to_text: ^7.5.0
  flutter_tts: ^4.2.5
  permission_handler: ^12.0.0
  path_provider: ^2.1.5

  # 네트워크
  dio: ^5.9.0
  json_annotation: ^4.9.0

  # 상태와 DI. ViewModel 은 ChangeNotifier 이고 주입은 get_it 이 한다.
  provider: ^6.1.5
  get_it: ^8.0.3

  # 설정과 유틸
  flutter_dotenv: ^5.2.1
  # 화면 테마·계정·음성 설정을 기기에 남긴다. 서버 설정 API 가 붙기 전까지의 정본이다.
  shared_preferences: ^2.5.5
  uuid: ^4.5.1
  intl: ^0.20.2
  logger: ^2.5.0

  # 기기에 저장하는 계정의 비밀번호를 해시로만 남긴다. 원문은 저장하지 않는다.
  crypto: ^3.0.7

  # 카카오 로그인. SDK 는 액세스 토큰만 받아오고 검증은 서버가 한다.
  kakao_flutter_sdk_user: ^1.9.7+3

  # 화면을 켜 둔 상태로 유지한다. 조리 모드에서만 켠다.
  wakelock_plus: ^1.2.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.14
  json_serializable: ^6.9.5
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  assets:
    - .env

  # Pretendard 가변 폰트. 목업과 같은 파일을 번들한다 — 기기 기본 한글 폰트로 떨어지면
  # 자간과 굵기가 달라 목업의 인상이 나오지 않는다.
  fonts:
    - family: Pretendard
      fonts:
        - asset: assets/fonts/PretendardVariable.ttf
