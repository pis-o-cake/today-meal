<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>메뉴 상세</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>@font-face{font-family:'Pretendard';src:url(/_blob/1b43482c59fb171bdbae3b012829170f) format('woff2');font-weight:45 920;font-style:normal;font-display:swap}@font-face{font-family:'Jua';src:url(/_blob/b80c3f239a19ae2ac0629973c9271ec7) format('woff2');font-weight:400;font-style:normal;font-display:swap}body{margin:0}</style>
</helmet>
<div style="position: relative; width: {{w}}px; height: {{h}}px; box-sizing: border-box; padding-top: {{top}}px; overflow: hidden; display: flex; flex-direction: column; font-family: 'Pretendard', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; color: #15181D; letter-spacing: -0.02em; background: radial-gradient(125% 70% at 50% 0%, #FFFFFF 0%, #FFF8F4 45%, #F8E3D9 100%)">

  <div style="display: flex; align-items: center; justify-content: space-between; padding: 8px 16px 0">
    <a href="{{links.home}}" aria-label="뒤로" style="width: 44px; height: 44px; box-sizing: border-box; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #15181D; background: rgba(255,255,255,0.8); border: 1px solid rgba(255,255,255,0.95); box-shadow: 0 4px 12px rgba(20,25,35,0.06); text-decoration: none">
      <sc-if value="{{isIOS}}" hint-placeholder-val="{{ true }}">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
      </sc-if>
      <sc-if value="{{isAndroid}}" hint-placeholder-val="{{ false }}">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"></path></svg>
      </sc-if>
    </a>
    <div style="display: flex; align-items: center; gap: 6px; height: 36px; box-sizing: border-box; padding: 0 12px; border-radius: 999px; background: rgba(255,255,255,0.8); border: 1px solid rgba(255,255,255,0.95); box-shadow: 0 4px 12px rgba(20,25,35,0.06); font-size: 13px; font-weight: 700">
      <span style="width: 7px; height: 7px; border-radius: 50%; background: #3F4FD1; box-shadow: 0 0 0 3px rgba(63,79,209,0.18)"></span>
      호출 대기 중
    </div>
  </div>

  <div style="flex-grow: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; gap: 16px; padding: 14px 20px 0">
    <div style="display: flex; flex-direction: column; gap: 8px">
      <div style="display: flex; gap: 6px">
        <span style="display: flex; align-items: center; gap: 4px; font-size: 13px; font-weight: 700; padding: 5px 10px; border-radius: 999px; background: #DDF3E4; color: #17703C">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>
          지금 가능
        </span>
      </div>
      <h1 style="margin: 0; font-size: 32px; line-height: 1.2; font-family: 'Jua', 'Pretendard', sans-serif; font-weight: 400; letter-spacing: -0.01em">두부계란전</h1>
      <div style="font-size: 15px; font-weight: 500; color: #5F6670">약 15분 · 조리 환경에 따라 달라요</div>
      <div style="display: flex; align-items: center; gap: 10px; margin-top: 4px; padding: 10px 14px; border-radius: 16px; background: rgba(255,255,255,0.7); border: 1px solid rgba(255,255,255,0.95)">
        <svg width="26" height="26" viewBox="0 0 48 48" aria-hidden="true" style="flex-shrink: 0">
          <circle cx="24" cy="24" r="20" fill="#FFB3A0"></circle>
          <path d="{{urgentFill}}" fill="#333A52"></path>
          <path d="M14 18.5 l6 -2 M34 18.5 l-6 -2" fill="none" stroke="#333A52" stroke-width="2.2" stroke-linecap="round"></path>
        </svg>
        <span style="font-size: 15px; font-weight: 600; color: #B0341A">소비기한이 내일인 두부를 먼저 써요</span>
      </div>
    </div>

    <div style="display: flex; align-items: center; justify-content: space-between">
      <span style="font-size: 16px; font-weight: 700">인분</span>
      <div style="display: flex; align-items: center; gap: 4px; padding: 4px; border-radius: 26px; background: rgba(255,255,255,0.8); border: 1px solid rgba(255,255,255,0.95); box-shadow: 0 4px 12px rgba(20,25,35,0.06)">
        <button type="button" aria-label="인분 줄이기" style="width: 44px; height: 44px; padding: 0; border: 0; border-radius: 50%; background: transparent; color: #15181D; display: flex; align-items: center; justify-content: center; cursor: pointer">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"></path></svg>
        </button>
        <span style="min-width: 64px; text-align: center; font-size: 18px; font-weight: 700">2인분</span>
        <button type="button" aria-label="인분 늘리기" style="width: 44px; height: 44px; padding: 0; border: 0; border-radius: 50%; background: #15181D; color: #FFFFFF; display: flex; align-items: center; justify-content: center; cursor: pointer">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
        </button>
      </div>
    </div>

    <section aria-label="재료" style="border-radius: 22px; background: rgba(255,255,255,0.86); border: 1px solid rgba(255,255,255,0.95); box-shadow: 0 6px 18px rgba(20,25,35,0.06); padding: 6px 0">
      <div style="display: flex; align-items: baseline; justify-content: space-between; padding: 10px 16px 6px">
        <span style="font-size: 15px; font-weight: 700">재료</span>
        <span style="font-size: 13px; font-weight: 500; color: #5F6670">2인분 기준</span>
      </div>
      <sc-for list="{{ingredients}}" as="i" hint-placeholder-count="5">
        <div style="display: flex; align-items: center; gap: 10px; min-height: 48px; padding: 4px 16px; box-sizing: border-box">
          <span style="{{i.iconStyle}}">{{i.icon}}</span>
          <span style="font-size: 16px; font-weight: {{i.weight}}">{{i.name}}</span>
          <span style="flex-grow: 1; font-size: 14px; font-weight: 500; color: #5F6670">{{i.amount}}</span>
          <span style="font-size: 13px; font-weight: 700; color: {{i.statusColor}}">{{i.status}}</span>
        </div>
      </sc-for>
    </section>

    <section aria-label="조리 순서" style="border-radius: 22px; background: rgba(255,255,255,0.86); border: 1px solid rgba(255,255,255,0.95); box-shadow: 0 6px 18px rgba(20,25,35,0.06); padding: 16px 16px 8px">
      <div style="font-size: 15px; font-weight: 700; margin-bottom: 10px">조리 순서</div>
      <ol style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px">
        <sc-for list="{{steps}}" as="s" hint-placeholder-count="4">
          <li style="display: flex; gap: 12px; align-items: flex-start">
            <span style="width: 28px; height: 28px; flex-shrink: 0; border-radius: 50%; background: #15181D; color: #FFFFFF; font-size: 14px; font-weight: 700; display: flex; align-items: center; justify-content: center">{{s.n}}</span>
            <span style="font-size: 16px; line-height: 1.5; font-weight: 500; padding-top: 2px">{{s.text}}</span>
          </li>
        </sc-for>
      </ol>
    </section>
  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; display: flex; flex-direction: column; gap: 8px; padding: 28px 20px {{footBottom}}px; background: linear-gradient(to bottom, rgba(248,227,217,0) 0%, rgba(248,227,217,0.96) 34%)">
    <a href="{{links.cook}}" style="display: flex; align-items: center; justify-content: center; gap: 8px; height: 56px; border: 0; text-decoration: none; border-radius: 28px; background: #15181D; color: #FFFFFF; font-size: 17px; font-weight: 700; box-shadow: 0 10px 22px rgba(20,25,35,0.22);">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 11h14v6a3 3 0 0 1-3 3H8a3 3 0 0 1-3-3z M3.5 11h17 M10 8.5h4 M9.5 6c0-1.2 1-1.3 1-2.5 M13.5 6c0-1.2 1-1.3 1-2.5"></path></svg>
      조리 모드 시작
    </a>
    <div style="text-align: center; font-size: 13px; line-height: 1.5; font-weight: 500; color: #4E5661; white-space: pre-line">단계마다 읽어 주고, 타이머도 말로 맞춰요.
다 만들면 쓴 재료를 알아서 빼 둘게요.</div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"platform":{"editor":"enum","options":["ios","android"],"default":"ios"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var android = (this.props.platform || 'ios') === 'android';
    var g = android ? { w: 412, h: 915, top: 40, bottom: 24 } : { w: 390, h: 844, top: 59, bottom: 34 };
    var L = function (n) { return (android ? 'Android-' : '') + n + '.dc.html'; };
    var sp = function (cx, cy, h) { return 'M' + (cx - 2.5) + ' ' + (cy - h / 2 + 2.5) + ' a2.5 2.5 0 0 1 5 0 v' + (h - 5) + ' a2.5 2.5 0 0 1 -5 0 z'; };
    var dt = function (cx, cy, r) { return 'M' + (cx - r) + ' ' + cy + ' a' + r + ' ' + r + ' 0 1 0 ' + (2 * r) + ' 0 a' + r + ' ' + r + ' 0 1 0 ' + (-2 * r) + ' 0 z'; };
    var ok = { icon: '✓', bg: '#DDF3E4', fg: '#17703C' };
    var chk = { icon: '?', bg: '#FFEBC7', fg: '#8F5A08' };
    // 재료 상태는 있어요 · 확인 필요 · 없어요 세 갈래(앱과 같음). 꼭 필요한 재료는 굵게, 있으면 좋은 재료는 보통 굵기.
    var mk = function (t, name, amount, status, statusColor, optional) {
      return {
        name: name, amount: amount, status: status, statusColor: statusColor, icon: t.icon, weight: optional ? 500 : 700,
        iconStyle: 'width: 24px; height: 24px; flex-shrink: 0; border-radius: 50%; background: ' + t.bg + '; color: ' + t.fg + '; font-size: 13px; font-weight: 700; display: flex; align-items: center; justify-content: center'
      };
    };
    return {
      w: g.w, h: g.h, top: g.top, footBottom: g.bottom + 8,
      isIOS: !android, isAndroid: android,
      urgentFill: sp(19, 25, 9) + ' ' + sp(29, 25, 9) + ' ' + dt(24, 32, 2.2),
      ingredients: [
        mk(ok, '두부', '1모', '있어요', '#17703C'),
        mk(ok, '계란', '2개', '있어요', '#17703C'),
        mk(ok, '식용유', '2큰술', '있어요', '#17703C'),
        mk(chk, '대파', '약간', '확인 필요', '#8F5A08', true),
        mk(ok, '소금', '약간', '있어요', '#17703C', true)
      ],
      steps: [
        { n: 1, text: '두부를 1cm 두께로 썰어 물기를 뺀다' },
        { n: 2, text: '계란을 풀어 소금으로 간한다' },
        { n: 3, text: '두부에 계란물을 묻힌다' },
        { n: 4, text: '달군 팬에 식용유를 두르고 양면을 노릇하게 부친다' }
      ],
      links: { home: L('Main'), cook: L('Cooking') }
    };
  }
}
</script>
</body>
</html>
