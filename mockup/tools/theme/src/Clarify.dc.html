<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>확인 질문</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>@font-face{font-family:'Pretendard';src:url(/_blob/1b43482c59fb171bdbae3b012829170f) format('woff2');font-weight:45 920;font-style:normal;font-display:swap}@font-face{font-family:'Jua';src:url(/_blob/b80c3f239a19ae2ac0629973c9271ec7) format('woff2');font-weight:400;font-style:normal;font-display:swap}body{margin:0}</style>
</helmet>
<div style="position: relative; width: {{w}}px; height: {{h}}px; box-sizing: border-box; padding-top: {{top}}px; padding-bottom: {{bottom}}px; overflow: hidden; display: flex; flex-direction: column; font-family: 'Pretendard', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; color: #15181D; letter-spacing: -0.02em; background: radial-gradient(125% 80% at 50% 26%, #FFFFFF 0%, #FFFAF0 40%, #FFE6BA 100%)">

  <div style="display: flex; align-items: center; gap: 14px; padding: 10px 16px 0 22px">
    <sc-if value="{{hasSteps}}" hint-placeholder-val="{{ true }}">
    <ol aria-label="진행 단계" style="flex-grow: 1; min-width: 0; list-style: none; margin: 0; padding: 0; display: flex; align-items: flex-end; gap: 6px">
      <li style="flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; gap: 9px">
        <div style="height: 6px; border-radius: 3px; background: #E08E00; opacity: 0.55"></div>
        <div style="display: flex; align-items: center; justify-content: center; gap: 4px; height: 20px; font-size: 14px; font-weight: 600; color: #4E5661; white-space: nowrap">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#E08E00" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>
          듣기<span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap">완료</span>
        </div>
      </li>
      <li aria-current="step" style="flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; gap: 9px">
        <div style="position: relative; height: 6px; border-radius: 3px; overflow: hidden; background: #E08E00; box-shadow: 0 2px 8px #E08E0055">
          <svg width="100%" height="6" viewBox="0 0 100 6" preserveAspectRatio="none" aria-hidden="true" style="position: absolute; left: 0; top: 0; display: block">
            <defs><linearGradient id="stepSheenAsk" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FFFFFF" stop-opacity="0"></stop><stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.8"></stop><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"></stop></linearGradient></defs>
            <rect x="-50" y="0" width="50" height="6" fill="url(#stepSheenAsk)"><animate attributeName="x" values="-50;100" dur="1.5s" repeatCount="indefinite"></animate></rect>
          </svg>
        </div>
        <div style="display: flex; align-items: center; justify-content: center; gap: 5px; height: 20px; font-size: 14px; font-weight: 800; letter-spacing: -0.03em; color: #9A5B00; white-space: nowrap">
          <svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="4" fill="#9A5B00" fill-opacity="0.3"><animate attributeName="r" values="4;8;4" dur="1.4s" repeatCount="indefinite"></animate><animate attributeName="fill-opacity" values="0.35;0;0.35" dur="1.4s" repeatCount="indefinite"></animate></circle><circle cx="8" cy="8" r="4" fill="#9A5B00"></circle></svg>
          확인 중
        </div>
      </li>
      <li style="flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; gap: 9px">
        <div style="height: 6px; border-radius: 3px; background: rgba(21,24,29,0.1)"></div>
        <div style="display: flex; align-items: center; justify-content: center; height: 20px; font-size: 14px; font-weight: 600; color: #9AA0A8; white-space: nowrap">반영</div>
      </li>
    </ol>
    </sc-if>
    <sc-if value="{{noSteps}}" hint-placeholder-val="{{ false }}">
      <div style="flex-grow: 1"></div>
    </sc-if>
    <a href="{{links.home}}" aria-label="닫기" style="width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #3E454E; background: rgba(255,255,255,0.74); border: 1px solid rgba(255,255,255,0.95); box-sizing: border-box; text-decoration: none">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
    </a>
  </div>

  <div style="display: flex; align-items: center; gap: 10px; margin: 14px 20px 0; min-height: 52px; box-sizing: border-box; padding: 4px 6px 4px 6px; border-radius: 18px; background: rgba(255,255,255,0.78); border: 1px solid rgba(255,255,255,0.95); box-shadow: 0 6px 18px rgba(20,25,35,0.06)">
    <span aria-hidden="true" style="width: 40px; height: 40px; flex-shrink: 0; border-radius: 14px; background: #DDF3E4; display: flex; align-items: center; justify-content: center; overflow: hidden">
      <dc-import name="Mascot2" mood="done" size="38" hint-size="38px,38px"></dc-import>
    </span>
    <span style="flex-grow: 1; font-size: 15px; font-weight: 600">계란 10개는 먼저 반영했어요</span>
    <button type="button" style="height: 44px; padding: 0 12px; border: 0; background: transparent; font-family: inherit; font-size: 14px; font-weight: 700; color: #3E454E; cursor: pointer">되돌리기</button>
  </div>

  <main style="flex-grow: 1; min-height: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 0 24px; text-align: center">
    <sc-if value="{{c1}}" hint-placeholder-val="{{ true }}">
      <dc-import name="Mascot" mood="asking" size="{{mascotSize}}" hint-size="{{mascotHint}}"></dc-import>
    </sc-if>
    <sc-if value="{{c2}}" hint-placeholder-val="{{ false }}">
      <dc-import name="Mascot2" mood="asking" size="{{mascotSize}}" hint-size="{{mascotHint}}"></dc-import>
    </sc-if>
    <sc-if value="{{c3}}" hint-placeholder-val="{{ false }}">
      <dc-import name="Mascot3" mood="asking" size="{{mascotSize}}" hint-size="{{mascotHint}}"></dc-import>
    </sc-if>
    <div style="font-size: 34px; line-height: 1.15; font-family: 'Jua', 'Pretendard', sans-serif; font-weight: 400; letter-spacing: -0.01em; color: #9A5B00; margin-top: 4px">하나만 물어볼게요!</div>
    <h1 style="margin: 12px 0 0; font-size: 23px; line-height: 1.4; font-weight: 700; letter-spacing: -0.035em; white-space: pre-line">두부의 2026년 10월 3일은
어떤 날짜예요?</h1>
    <div style="font-size: 14px; font-weight: 500; color: #5F6670; margin-top: 8px">모르면 그대로 둘게요. 없는 값을 채우지 않아요</div>
  </main>

  <div role="group" aria-label="날짜 종류" style="display: flex; flex-direction: column; gap: 10px; padding: 16px 20px 0">
    <a href="{{links.result}}" style="display: flex; align-items: center; gap: 12px; height: 60px; box-sizing: border-box; padding: 0 18px; border-radius: 20px; background: #FFFFFF; border: 2px solid #9A5B00; color: #15181D; text-decoration: none; box-shadow: 0 8px 20px rgba(20,25,35,0.08)">
      <span style="width: 22px; height: 22px; box-sizing: border-box; border-radius: 50%; border: 6px solid #9A5B00; flex-shrink: 0"></span>
      <span style="flex-grow: 1; font-size: 17px; font-weight: 700">소비기한</span>
      <span style="font-size: 13px; font-weight: 600; color: #5F6670">“소비기한이야”</span>
    </a>
    <a href="{{links.result}}" style="display: flex; align-items: center; gap: 12px; height: 60px; box-sizing: border-box; padding: 0 18px; border-radius: 20px; background: rgba(255,255,255,0.78); border: 1px solid rgba(255,255,255,0.95); color: #15181D; text-decoration: none; box-shadow: 0 6px 18px rgba(20,25,35,0.06)">
      <span style="width: 22px; height: 22px; box-sizing: border-box; border-radius: 50%; border: 2px solid #A2A8B0; flex-shrink: 0"></span>
      <span style="flex-grow: 1; font-size: 17px; font-weight: 700">유통기한</span>
    </a>
    <a href="{{links.result}}" style="display: flex; align-items: center; gap: 12px; height: 60px; box-sizing: border-box; padding: 0 18px; border-radius: 20px; background: rgba(255,255,255,0.78); border: 1px solid rgba(255,255,255,0.95); color: #15181D; text-decoration: none; box-shadow: 0 6px 18px rgba(20,25,35,0.06)">
      <span style="width: 22px; height: 22px; box-sizing: border-box; border-radius: 50%; border: 2px solid #A2A8B0; flex-shrink: 0"></span>
      <span style="flex-grow: 1; font-size: 17px; font-weight: 700">잘 모르겠어요</span>
      <span style="font-size: 13px; font-weight: 600; color: #5F6670">미확인으로 둘게요</span>
    </a>
  </div>

  <div style="display: flex; align-items: center; justify-content: center; gap: 10px; padding: 16px 20px 8px">
    <svg width="36" height="36" viewBox="0 0 36 36" aria-hidden="true">
      <circle cx="18" cy="18" r="15" fill="none" stroke="rgba(154,91,0,0.18)" stroke-width="3.5"></circle>
      <circle cx="18" cy="18" r="15" fill="none" stroke="#9A5B00" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="94.2" stroke-dashoffset="18.8" transform="rotate(-90 18 18)"></circle>
      <text x="18" y="23" text-anchor="middle" font-size="14" font-weight="800" fill="#15181D" font-family="Pretendard, sans-serif">8</text>
    </svg>
    <span style="font-size: 14px; font-weight: 600; color: #3E454E">8초 동안은 부르지 않고 바로 말해도 돼요</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"platform":{"editor":"enum","options":["ios","android"],"default":"ios"},"character":{"editor":"enum","options":["1","2","3"],"default":"2"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var android = (this.props.platform || 'ios') === 'android';
    var ch = String(this.props.character || '2');
    var c2 = ch === '2';
    var c3 = ch === '3';
    var g = android ? { w: 412, h: 915, top: 40, bottom: 24, mascot: 176 } : { w: 390, h: 844, top: 59, bottom: 34, mascot: 140 };
    var L = function (n) { return (android ? 'Android-' : '') + n + '.dc.html'; };
    // 글래스는 한 화면에서 끝나므로 단계 막대가 없다.
    var single = THEME === 'glass';
    return { hasSteps: !single, noSteps: single,
      w: g.w, h: g.h, top: g.top, bottom: g.bottom,
      c1: !c2 && !c3, c2: c2, c3: c3,
      mascotSize: g.mascot, mascotHint: g.mascot + 'px,' + g.mascot + 'px',
      links: { home: L('Main'), result: L('Result') }
    };
  }
}
</script>
</body>
</html>
