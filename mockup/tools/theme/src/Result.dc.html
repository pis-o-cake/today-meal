<div style="position: relative; width: {{w}}px; height: {{h}}px; box-sizing: border-box; padding-top: {{top}}px; padding-bottom: {{bottom}}px; overflow: hidden; display: flex; flex-direction: column; font-family: 'Pretendard', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; color: #15181D; letter-spacing: -0.02em; background: radial-gradient(125% 80% at 50% 24%, #FFFFFF 0%, #F3FBF6 40%, #D3EFDD 100%)">

        </div>
      </li>
      <li style="flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; gap: 9px">
        <div style="height: 6px; border-radius: 3px; background: #23A05A; opacity: 0.55"></div>
        <div style="display: flex; align-items: center; justify-content: center; gap: 4px; height: 20px; font-size: 14px; font-weight: 600; color: #4E5661; white-space: nowrap">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#23A05A" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>

        </div>
      </li>
      <li aria-current="step" style="flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; gap: 9px">
        <div style="height: 6px; border-radius: 3px; background: #23A05A; box-shadow: 0 2px 8px #23A05A55"></div>

          <svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="11" fill="#1B7F43"></circle><path d="M6.5 12.5l3.5 3.5 7.5-8" fill="none" stroke="#FFFFFF" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"></path></svg>
          반영 완료
        </div>
      </li>
    </ol>
    </sc-if>
    <sc-if value="{{noSteps}}" hint-placeholder-val="{{ false }}">
      <div style="flex-grow: 1"></div>
    </sc-if>
    <a href="{{links.home}}" aria-label="닫기" style="width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #3E454E; background: rgba(255,255,255,0.74); border: 1px solid rgba(255,255,255,0.95); box-sizing: border-box; text-decoration: none">

    <sc-if value="{{c1}}" hint-placeholder-val="{{ true }}">

    </sc-if>
    <sc-if value="{{c2}}" hint-placeholder-val="{{ false }}">
      <dc-import name="Mascot2" mood="{{heroMood}}" size="{{mascotSize}}" hint-size="{{mascotHint}}"></dc-import>
    </sc-if>
    <sc-if value="{{c3}}" hint-placeholder-val="{{ false }}">
      <dc-import name="Mascot3" mood="done" size="{{mascotSize}}" hint-size="{{mascotHint}}"></dc-import>
    </sc-if>
    <sc-if value="{{hasSteps}}" hint-placeholder-val="{{ true }}">
      <div style="font-size: 40px; line-height: 1.15; font-family: 'Jua', 'Pretendard', sans-serif; font-weight: 400; letter-spacing: -0.01em; color: #1B7F43; margin-top: 4px">반영했어요</div>
    </sc-if>
    <sc-if value="{{noSteps}}" hint-placeholder-val="{{ false }}">
      <div style="font-size: 38px; line-height: 1.15; font-family: 'Jua', 'Pretendard', sans-serif; font-weight: 400; letter-spacing: -0.01em; color: hsl(232,55%,42%); margin-top: 4px">반영했어요</div>
    </sc-if>
    <div style="display: flex; align-items: flex-start; gap: 8px; margin-top: 12px; max-width: 320px; text-align: left">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1B7F43" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0; margin-top: 2px"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"></path><path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"></path></svg>
      <span style="font-size: 15px; line-height: 1.5; font-weight: 500; color: #3E454E">“두부 2모, 계란 10개 등록했어요. 두부 소비기한은 2026년 10월 3일이에요.”</span>
    </div>
  </main>

  <section aria-label="바뀐 재고" style="margin: 16px 20px 0; border-radius: 24px; background: rgba(255,255,255,0.84); border: 1px solid rgba(255,255,255,0.95); box-shadow: 0 10px 28px rgba(20,25,35,0.08); display: flex; flex-direction: column">
    <div style="display: flex; align-items: center; gap: 12px; padding: 16px 18px">
      <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 6px">
        <span style="font-size: 20px; font-weight: 700">두부</span>
        <div style="display: flex; flex-wrap: wrap; gap: 6px">
          <span style="font-size: 13px; font-weight: 700; padding: 4px 8px; border-radius: 8px; background: #FFE4DB; color: #B0341A">소비기한 2026.10.03 · D-1</span>
          <span style="font-size: 13px; font-weight: 600; padding: 4px 8px; border-radius: 8px; background: #EEF0F3; color: #4E5661">냉장</span>
        </div>
      </div>
      <div style="display: flex; flex-direction: column; align-items: flex-end">
        <span style="font-size: 12px; font-weight: 600; color: #5F6670">새로</span>
        <span style="font-size: 28px; font-weight: 700; letter-spacing: -0.04em">2모</span>
      </div>
    </div>
    <div style="height: 1px; margin: 0 18px; background: rgba(21,24,29,0.07)"></div>
    <div style="display: flex; align-items: center; gap: 12px; padding: 16px 18px">
      <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 6px">
        <span style="font-size: 20px; font-weight: 700">계란</span>
        <div style="display: flex; flex-wrap: wrap; gap: 6px">
          <span style="display: flex; align-items: center; gap: 4px; font-size: 13px; font-weight: 700; padding: 4px 8px; border-radius: 8px; background: #ECEEF2; color: #4E5661">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M9.8 9.5a2.3 2.3 0 1 1 3.3 2.1c-.7.4-1.1.9-1.1 1.7M12 16.8v.1"></path></svg>
            날짜 몰라요
          </span>
          <span style="font-size: 13px; font-weight: 600; padding: 4px 8px; border-radius: 8px; background: #EEF0F3; color: #4E5661">냉장</span>
        </div>
      </div>
      <div style="display: flex; flex-direction: column; align-items: flex-end">
        <span style="font-size: 12px; font-weight: 600; color: #5F6670">새로</span>
        <span style="font-size: 28px; font-weight: 700; letter-spacing: -0.04em">10개</span>
      </div>
    </div>
  </section>

  <div style="display: flex; gap: 10px; padding: 16px 20px 0">
    <button type="button" style="flex-grow: 1; flex-basis: 0; box-sizing: border-box; display: flex; align-items: center; justify-content: center; gap: 8px; height: 56px; border-radius: 28px; border: 1px solid rgba(255,255,255,0.95); background: rgba(255,255,255,0.8); box-shadow: 0 6px 18px rgba(20,25,35,0.07); font-family: inherit; font-size: 16px; font-weight: 700; color: #15181D; cursor: pointer">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9h10a5 5 0 0 1 0 10H8"></path><path d="M8 5L4 9l4 4"></path></svg>
      되돌리기
    </button>
    <a href="{{links.home}}" style="flex-grow: 1; flex-basis: 0; box-sizing: border-box; border: 1px solid #15181D; display: flex; align-items: center; justify-content: center; height: 56px; border-radius: 28px; background: #15181D; color: #FFFFFF; text-decoration: none; font-size: 16px; font-weight: 700; box-shadow: 0 10px 22px rgba(20,25,35,0.22)">확인</a>

  <div style="text-align: center; font-size: 13px; font-weight: 500; color: #5F6670; padding: 12px 20px 8px">4초 뒤 호출 대기로 돌아가요</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"platform":{"editor":"enum","options":["ios","android"],"default":"ios"},"character":{"editor":"enum","options":["1","2","3"],"default":"2"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var android = (this.props.platform || 'ios') === 'android';
    var ch = String(this.props.character || '2');
    var c2 = ch === '2';
    var c3 = ch === '3';
    var g = android ? { w: 412, h: 915, top: 40, bottom: 24, mascot: 176 } : { w: 390, h: 844, top: 59, bottom: 34, mascot: 140 };
    var L = function (n) { return (android ? 'Android-' : '') + n + '.dc.html'; };
    // 글래스는 한 화면에서 끝난다: 단계 막대 없이, 듣던 캐릭터(보라) 그대로 결과를 알린다.
    var single = THEME === 'glass';
    return { hasSteps: !single, noSteps: single, heroMood: single ? 'listening' : 'done',
      w: g.w, h: g.h, top: g.top, bottom: g.bottom,
      c1: !c2 && !c3, c2: c2, c3: c3,
      mascotSize: g.mascot, mascotHint: g.mascot + 'px,' + g.mascot + 'px',
      links: { home: L('Main') }
    };
  }
}
</script>
