<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no,maximum-scale=1">
<meta name="theme-color" content="#FFF3EF">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>오늘 뭐 먹지?</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css">
<style>
  :root{
    --acc:#FF5E3A; --bg1:#FFF3EF; --bg2:#FFD9CC; --ray:.30;
    --ink:#15181D; --ink2:#7C838C; --ink3:#A7AEB6;
    --sb:env(safe-area-inset-bottom,0px); --st:env(safe-area-inset-top,0px);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;width:100%;overflow:hidden;overscroll-behavior:none}
  body{font-family:"Pretendard Variable",Pretendard,"Apple SD Gothic Neo",-apple-system,system-ui,sans-serif;
       background:#0d0f12;color:var(--ink);-webkit-font-smoothing:antialiased;
       font-feature-settings:"ss01";letter-spacing:-.015em}
  .phone{position:relative;width:100%;max-width:430px;height:100dvh;margin:0 auto;overflow:hidden;
         display:flex;flex-direction:column;background:#fff}
  @media(min-width:520px){
    body{display:flex;align-items:center;justify-content:center;background:#0d0f12}
    .phone{height:min(900px,95dvh);border-radius:46px;box-shadow:0 40px 90px rgba(0,0,0,.55),0 0 0 2px #23262b}
  }
  .bg{position:absolute;inset:0;pointer-events:none;
      background:radial-gradient(125% 78% at 50% 16%,#fff 0%,var(--bg1) 40%,var(--bg2) 100%)}
  .rays{position:absolute;left:50%;top:-8%;width:200%;aspect-ratio:1;transform:translateX(-50%);
        pointer-events:none;opacity:var(--ray);
        background:conic-gradient(from 0deg,transparent 0 2.6deg,rgba(255,255,255,.95) 3.4deg 4.6deg,transparent 5.4deg 10deg);
        -webkit-mask-image:radial-gradient(circle,transparent 6%,#000 22%,transparent 58%);
        mask-image:radial-gradient(circle,transparent 6%,#000 22%,transparent 58%);
        animation:spin 110s linear infinite}
  @keyframes spin{to{transform:translateX(-50%) rotate(360deg)}}

  .head{position:relative;flex:none;padding:calc(var(--st) + 22px) 24px 0;text-align:center}
  .hi{font-size:14px;color:var(--ink2);font-weight:500}
  .q{font-size:27px;font-weight:700;margin-top:5px;letter-spacing:-.035em}
  .iconbtn{position:absolute;right:20px;top:calc(var(--st) + 18px);width:44px;height:44px;border-radius:50%;
    background:rgba(255,255,255,.72);border:1px solid rgba(255,255,255,.9);color:var(--ink);
    display:flex;align-items:center;justify-content:center;backdrop-filter:blur(10px);
    box-shadow:0 6px 18px rgba(20,25,35,.09);z-index:7}

  .pane{display:none;flex:1;min-height:0}
  .pane.on{display:flex;flex-direction:column}

  .stage{position:relative;flex:1;min-height:0;display:flex;flex-direction:column;
         align-items:center;justify-content:center;touch-action:none;padding:0 20px}
  .charbox{position:relative;width:min(70vw,258px);aspect-ratio:1;flex:none;animation:float 5.5s ease-in-out infinite}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-13px)}}
  .char{position:absolute;inset:0;will-change:opacity,transform}
  .char svg{width:100%;height:100%;display:block}

  .label{position:relative;height:74px;width:100%;margin-top:6px}
  .lab{position:absolute;inset:0;text-align:center;will-change:opacity,transform}
  .lab .big{font-size:40px;font-weight:800;letter-spacing:-.045em;color:var(--acc);line-height:1.05}
  .lab .sm{font-size:14.5px;color:var(--ink2);margin-top:7px;font-weight:500}

  .items{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;min-height:28px;margin-top:2px}
  .it{font-size:12.5px;font-weight:600;padding:6px 11px;border-radius:999px;color:#5A616A;
      background:rgba(255,255,255,.72);border:1px solid rgba(255,255,255,.95);
      box-shadow:0 2px 8px rgba(20,25,35,.05)}

  .cta{flex:none;display:flex;justify-content:center;padding:16px 20px 4px}
  .cbtn{display:inline-flex;align-items:center;gap:10px;background:#fff;color:var(--ink);border:0;
        font:inherit;font-size:16px;font-weight:700;letter-spacing:-.02em;padding:15px 22px;border-radius:999px;
        box-shadow:0 10px 26px rgba(20,25,35,.13),0 2px 5px rgba(20,25,35,.06)}
  .cbtn .em{font-size:19px}
  .cbtn .ar{color:var(--acc);font-weight:800}

  .hint{text-align:center;font-size:12px;color:var(--ink3);font-weight:500;margin:14px 0 9px;
        display:flex;align-items:center;justify-content:center;gap:6px}
  .swipe{flex:none;touch-action:none;padding-bottom:2px}
  .scale{position:relative;height:70px;margin:0 18px;border-radius:26px;display:flex;align-items:center;
         background:rgba(255,255,255,.58);border:1px solid rgba(255,255,255,.92);
         backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
         box-shadow:0 10px 28px rgba(20,25,35,.09),inset 0 1px 0 rgba(255,255,255,.7)}
  .pill{position:absolute;top:6px;left:0;width:58px;height:58px;border-radius:20px;background:#fff;
        box-shadow:0 6px 16px rgba(20,25,35,.14);will-change:transform}
  .ticks{position:relative;display:flex;width:100%;height:100%;align-items:center;z-index:2;padding:0 4px}
  .tick{flex:1;display:flex;align-items:center;justify-content:center;height:100%;will-change:transform,filter,opacity}
  .tick svg{width:38px;height:38px}
  .divider{width:1px;height:30px;background:rgba(21,24,29,.10);flex:none;margin:0 3px}

  .tabs{flex:none;display:flex;justify-content:space-around;align-items:center;margin-top:12px;
        padding:11px 14px calc(var(--sb) + 12px);border-top:1px solid rgba(21,24,29,.07);
        background:rgba(255,255,255,.55);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
  .tab{background:0;border:0;font:inherit;color:var(--ink3);font-size:11px;font-weight:600;
       display:flex;flex-direction:column;align-items:center;gap:5px;padding:2px 18px;letter-spacing:-.01em}
  .tab svg{width:23px;height:23px}
  .tab[aria-pressed="true"]{color:var(--acc)}

  .list{flex:1;overflow:auto;padding:12px 18px 16px}
  .ic2{display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.75);
       border:1px solid rgba(255,255,255,.95);border-radius:20px;padding:12px 14px;margin-bottom:9px;
       position:relative;box-shadow:0 4px 14px rgba(20,25,35,.05)}
  .ic2 svg{width:42px;height:42px;flex:none}
  .ic2.dash{border:1px dashed rgba(21,24,29,.18);background:rgba(255,255,255,.45)}
  .ic2 .nm{font-size:17px;font-weight:700}
  .ic2 .sub{font-size:12.5px;margin-top:2px;font-weight:600}
  .ic2 .qt{margin-left:auto;font-size:16px;font-weight:700;color:#4A5058}
  .bdg{position:absolute;top:8px;right:10px;font-size:10px;font-weight:700;padding:3px 7px;
       border-radius:999px;background:rgba(21,24,29,.06);color:var(--ink2)}
  .row2{display:flex;align-items:center;gap:10px;padding:13px 4px;border-bottom:1px solid rgba(21,24,29,.07)}
  .kd{font-size:10px;font-weight:800;padding:4px 8px;border-radius:8px;min-width:42px;text-align:center}
  .k-in{background:#E6F6EA;color:#2E9E52}.k-use{background:#FFF0DC;color:#D2860F}
  .k-fix{background:#FFEAE4;color:#E04F2C}.k-adj{background:#EEF0F3;color:#6E757D}
  .k-un{background:#F1F2F4;color:#8A9098}
  .row2 .tx{font-size:15px;font-weight:500}.row2 .qy{margin-left:auto;font-size:16px;font-weight:700}
  .row2 .tm{font-size:12px;color:var(--ink3);width:42px;flex:none;font-weight:600}

  .sheet{position:absolute;left:0;right:0;bottom:0;z-index:9;background:#fff;
         border-radius:28px 28px 0 0;padding:22px 22px calc(var(--sb) + 20px);
         box-shadow:0 -18px 50px rgba(20,25,35,.18);
         transform:translateY(118%);transition:transform .38s cubic-bezier(.22,1,.36,1)}
  .sheet.up{transform:translateY(0)}
  .sheet .grip{width:38px;height:4px;border-radius:99px;background:rgba(21,24,29,.14);margin:0 auto 16px}
  .sheet .st2{font-size:22px;font-weight:800;letter-spacing:-.03em}
  .sheet .ut{font-size:14.5px;color:var(--ink2);margin-top:8px;line-height:1.55;font-weight:500}
  .sheet .bs{display:flex;gap:9px;margin-top:18px}
  .sheet button{flex:1;font:inherit;font-size:15px;font-weight:700;padding:15px;border-radius:16px;
                border:1px solid rgba(21,24,29,.10);background:#F4F5F7;color:var(--ink)}
  .sheet button.pri{background:var(--acc);color:#fff;border-color:transparent}
</style>
</head>
<body>
<div class="phone">
  <div class="bg"></div><div class="rays"></div>

  <div class="head">
    <div class="hi">안녕하세요, 철님 👋</div>
    <div class="q" id="qtitle">오늘 뭐 먹지?</div>
  </div>
  <button class="iconbtn" id="mic" aria-label="음성">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
      <rect x="9" y="2.8" width="6" height="11.4" rx="3"/><path d="M5.4 11.6a6.6 6.6 0 0 0 13.2 0"/><path d="M12 18.2v3"/></svg>
  </button>

  <section class="pane on" id="p-home">
    <div class="stage" id="stage">
      <div class="charbox" id="charbox"></div>
      <div class="label" id="labelbox"></div>
      <div class="items" id="items"></div>
    </div>

    <div class="cta">
      <button class="cbtn" id="cbtn"><span class="em" id="cEm">🥘</span><span id="cTx">두부조림 보기</span><span class="ar">→</span></button>
    </div>

    <div class="swipe" id="swipe">
      <div class="hint">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 6 15 12 9 18"/></svg>
        밀어서 오늘 쓸 재료 고르기
      </div>
      <div class="scale" id="scale"><div class="pill" id="pill"></div><div class="ticks" id="ticks"></div></div>
    </div>
  </section>

  <section class="pane" id="p-fridge"><div class="list" id="fridgeList"></div></section>
  <section class="pane" id="p-hist"><div class="list">
    <div class="row2"><span class="tm">19:02</span><span class="kd k-in">입고</span><span class="tx">계란 10개</span><span class="qy">10개</span></div>
    <div class="row2"><span class="tm">19:05</span><span class="kd k-use">사용</span><span class="tx">계란 2개 사용</span><span class="qy">8개</span></div>
    <div class="row2"><span class="tm">19:06</span><span class="kd k-fix">정정</span><span class="tx">사용을 3개로 교체</span><span class="qy">7개</span></div>
    <div class="row2"><span class="tm">19:07</span><span class="kd k-un">취소</span><span class="tx">정정 취소 · 복원</span><span class="qy">8개</span></div>
    <div class="row2"><span class="tm">19:09</span><span class="kd k-adj">보정</span><span class="tx">“네 개 남았어”</span><span class="qy">4개</span></div>
  </div></section>

  <div class="sheet" id="sheet">
    <div class="grip"></div>
    <div class="st2" id="shSt">듣고 있어요</div>
    <div class="ut" id="shUt">“두부 두 모랑 계란 열 개 넣었어. 두부는 소비기한 10월 3일”</div>
    <div class="bs"><button class="pri" id="shOk">네, 맞아요</button><button id="shNo">취소</button></div>
  </div>

  <nav class="tabs">
    <button class="tab" data-pane="home" aria-pressed="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3.6 12.4h16.8a8.4 8.4 0 0 1-16.8 0Z"/><path d="M5.8 20.6h12.4"/>
        <path d="M9.4 8.6c0-1.4 1.3-1.7 1.3-3.1 0-.7-.4-1.3-1-1.7"/><path d="M14.3 8.6c0-1.4 1.3-1.7 1.3-3.1 0-.7-.4-1.3-1-1.7"/></svg>오늘</button>
    <button class="tab" data-pane="fridge">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <rect x="5.6" y="2.8" width="12.8" height="18.4" rx="3.4"/><path d="M5.6 10.2h12.8"/><path d="M9 6.2v1.8"/><path d="M9 12.9v2"/></svg>냉장고</button>
    <button class="tab" data-pane="hist">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3.4 12a8.6 8.6 0 1 0 2.7-6.3"/><path d="M3.1 4.4v4.3h4.3"/><path d="M12 7.7V12l3.1 1.9"/></svg>기록</button>
  </nav>
</div>

<script>
const STEPS=[
 {key:'expired',c1:'#B9BFC6',c2:'#7E858D',bg1:'#F5F6F8',bg2:'#E1E5EA',ray:.06,exp:'x',dull:1,
  big:'지남',sm:'1가지 · 오늘 요리 후보에서 뺐어요',items:['삼겹살 9/27'],em:'🗑',cta:'상태 확인하기'},
 {key:'urgent',c1:'#FF8A63',c2:'#F0431B',bg1:'#FFF3EF',bg2:'#FFD5C6',ray:.30,exp:'frown',
  big:'급함',sm:'1가지 · 오늘 안에 쓰세요',items:['두부 D-1'],em:'🥘',cta:'두부조림 보기'},
 {key:'soon',c1:'#FFC061',c2:'#F59310',bg1:'#FFF8EC',bg2:'#FFE4B8',ray:.48,exp:'flat',
  big:'챙길 것',sm:'3가지 · 이번 주에 쓰세요',items:['대파 D-2','애호박 D-3','우유 개봉2일'],em:'🍳',cta:'대파계란말이 보기'},
 {key:'fresh',c1:'#8BE07E',c2:'#2FB457',bg1:'#F1FCF2',bg2:'#C9EFD1',ray:.80,exp:'smile',spark:1,
  big:'여유',sm:'2가지 · 급하지 않아요',items:['계란 D-14','다진마늘 D-22'],em:'🍚',cta:'계란찜 보기'},
 {key:'unknown',c1:'#C3C9D1',c2:'#8D96A1',bg1:'#F6F7F9',bg2:'#E3E7EC',ray:.05,exp:'q',dull:1,
  big:'미확인',sm:'1가지 · 기한을 알려주세요',items:['김치'],em:'❓',cta:'기한 알려주기'}
];
const BLOBS=[[100,112,54],[60,86,34],[140,86,34],[76,60,28],[124,60,28],[100,50,30],[52,124,26],[148,124,26]];
let uidn=0;

function jelly(st,px){
  const u='j'+(++uidn), INK='#2A2E35', W=6.6;
  let eyes='',mouth='',extra='';
  if(st.exp==='smile'){
    eyes=`<path d="M70 104 q10 -12 20 0" stroke="${INK}" stroke-width="${W}" fill="none" stroke-linecap="round"/>
          <path d="M110 104 q10 -12 20 0" stroke="${INK}" stroke-width="${W}" fill="none" stroke-linecap="round"/>`;
    mouth=`<path d="M85 120 q15 19 30 0" stroke="${INK}" stroke-width="${W}" fill="none" stroke-linecap="round"/>`;
  }else if(st.exp==='flat'){
    eyes=`<ellipse cx="82" cy="102" rx="5.2" ry="7" fill="${INK}"/><ellipse cx="118" cy="102" rx="5.2" ry="7" fill="${INK}"/>`;
    mouth=`<path d="M88 126 h24" stroke="${INK}" stroke-width="${W}" stroke-linecap="round"/>`;
  }else if(st.exp==='frown'){
    eyes=`<path d="M70 92 l19 9" stroke="${INK}" stroke-width="${W}" stroke-linecap="round"/>
          <path d="M130 92 l-19 9" stroke="${INK}" stroke-width="${W}" stroke-linecap="round"/>
          <ellipse cx="83" cy="110" rx="5" ry="6.4" fill="${INK}"/><ellipse cx="117" cy="110" rx="5" ry="6.4" fill="${INK}"/>`;
    mouth=`<path d="M85 138 q15 -17 30 0" stroke="${INK}" stroke-width="${W}" fill="none" stroke-linecap="round"/>`;
  }else if(st.exp==='x'){
    eyes=`<path d="M74 96 l15 15 M89 96 l-15 15" stroke="${INK}" stroke-width="5.6" stroke-linecap="round"/>
          <path d="M111 96 l15 15 M126 96 l-15 15" stroke="${INK}" stroke-width="5.6" stroke-linecap="round"/>`;
    mouth=`<path d="M89 132 h22" stroke="${INK}" stroke-width="5.6" stroke-linecap="round"/>`;
  }else{
    eyes=`<ellipse cx="83" cy="106" rx="4.8" ry="6.2" fill="${INK}"/><ellipse cx="117" cy="106" rx="4.8" ry="6.2" fill="${INK}"/>`;
    mouth=`<text x="100" y="146" text-anchor="middle" font-size="40" font-weight="800" fill="${INK}"
            font-family="Pretendard,system-ui">?</text>`;
  }
  if(st.spark){
    extra=`<g fill="#fff" opacity=".9">
      <path d="M168 54 l3 8 8 3 -8 3 -3 8 -3 -8 -8 -3 8 -3z"/>
      <path d="M32 96 l2.4 6.4 6.4 2.4 -6.4 2.4 -2.4 6.4 -2.4 -6.4 -6.4 -2.4 6.4 -2.4z"/>
      <path d="M150 146 l2 5 5 2 -5 2 -2 5 -2 -5 -5 -2 5 -2z"/></g>`;
  }
  return `<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
   <defs>
     <radialGradient id="b${u}" cx="33%" cy="22%" r="86%">
       <stop offset="0%" stop-color="#ffffff" stop-opacity=".95"/>
       <stop offset="38%" stop-color="${st.c1}" stop-opacity=".88"/>
       <stop offset="100%" stop-color="${st.c2}" stop-opacity=".97"/>
     </radialGradient>
     <radialGradient id="h${u}"><stop offset="0%" stop-color="#fff" stop-opacity=".9"/><stop offset="100%" stop-color="#fff" stop-opacity="0"/></radialGradient>
     <filter id="g${u}" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="13"/></filter>
     <filter id="sh${u}" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="7"/></filter>
   </defs>
   <g filter="url(#g${u})" opacity="${st.dull?.28:.5}"><circle cx="100" cy="100" r="66" fill="${st.c1}"/></g>
   <ellipse cx="100" cy="178" rx="46" ry="8.5" fill="${st.c2}" opacity="${st.dull?.13:.2}" filter="url(#sh${u})"/>
   <g opacity="${st.dull?.85:1}">
     ${BLOBS.map(b=>`<circle cx="${b[0]}" cy="${b[1]}" r="${b[2]}" fill="url(#b${u})" stroke="rgba(255,255,255,.55)" stroke-width="1.1"/>`).join('')}
     <ellipse cx="72" cy="58" rx="28" ry="19" fill="url(#h${u})" transform="rotate(-24 72 58)"/>
     <circle cx="132" cy="52" r="7" fill="#fff" opacity=".75"/>
     <circle cx="60" cy="132" r="4.5" fill="#fff" opacity=".45"/>
     ${eyes}${mouth}${extra}
   </g></svg>`;
}

const charbox=document.getElementById('charbox'),labelbox=document.getElementById('labelbox'),
      ticks=document.getElementById('ticks'),pill=document.getElementById('pill'),scaleEl=document.getElementById('scale');
STEPS.forEach((st,k)=>{
  const c=document.createElement('div');c.className='char';c.innerHTML=jelly(st);charbox.appendChild(c);
  const l=document.createElement('div');l.className='lab';
  l.innerHTML=`<div class="big">${st.big}</div><div class="sm">${st.sm}</div>`;labelbox.appendChild(l);
  if(k===STEPS.length-1){const d=document.createElement('div');d.className='divider';ticks.appendChild(d);}
  const t=document.createElement('div');t.className='tick';t.dataset.k=k;t.innerHTML=jelly(st);ticks.appendChild(t);
});
const charEls=[...charbox.children],labEls=[...labelbox.children],tickEls=[...ticks.querySelectorAll('.tick')];

const hx=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
const th=a=>'#'+a.map(v=>Math.round(v).toString(16).padStart(2,'0')).join('');
const mix=(a,b,t)=>th(hx(a).map((v,i)=>v+(hx(b)[i]-v)*t));
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const N=STEPS.length;let progress=1,raf=null;

const cOf=k=>{const r=tickEls[k].getBoundingClientRect(),s=scaleEl.getBoundingClientRect();return r.left-s.left+r.width/2;};
const cAt=i=>{const lo=Math.floor(clamp(i,0,N-1)),hi=Math.min(N-1,lo+1),f=clamp(i,0,N-1)-lo;return cOf(lo)+(cOf(hi)-cOf(lo))*f;};

function render(){
  const i=clamp(progress,0,N-1),lo=Math.floor(i),hi=Math.min(N-1,lo+1),f=i-lo,A=STEPS[lo],B=STEPS[hi];
  const R=document.documentElement.style;
  R.setProperty('--acc',mix(A.c2,B.c2,f));
  R.setProperty('--bg1',mix(A.bg1,B.bg1,f));
  R.setProperty('--bg2',mix(A.bg2,B.bg2,f));
  R.setProperty('--ray',(A.ray+(B.ray-A.ray)*f).toFixed(3));

  charEls.forEach((el,k)=>{const d=k-i,ad=Math.abs(d);
    el.style.opacity=ad>=1?0:Math.pow(1-ad,.85);
    el.style.transform=`scale(${1-Math.min(1,ad)*.16}) rotate(${d*5}deg)`;
    el.style.visibility=ad>=1?'hidden':'visible';});
  labEls.forEach((el,k)=>{const d=k-i,ad=Math.abs(d);
    el.style.opacity=ad>=1?0:Math.pow(1-ad,1.7);
    el.style.transform=`translateY(${d*20}px)`;
    el.style.visibility=ad>=1?'hidden':'visible';});
  tickEls.forEach((el,k)=>{const ad=Math.abs(k-i),near=Math.max(0,1-ad);
    el.style.filter=`grayscale(${(1-near)*.92}) saturate(${.45+.55*near})`;
    el.style.opacity=(.42+.58*near).toFixed(3);
    el.style.transform=`scale(${.9+near*.18})`;});
  pill.style.transform=`translateX(${cAt(i)-29}px)`;

  const n=Math.round(i),st=STEPS[n],near=1-Math.min(1,Math.abs(i-n)*2);
  document.getElementById('cEm').textContent=st.em;
  document.getElementById('cTx').textContent=st.cta;
  document.querySelector('.cta').style.opacity=(.35+.65*near).toFixed(3);
  const it=document.getElementById('items');
  it.innerHTML=st.items.map(x=>`<span class="it">${x}</span>`).join('');
  it.style.opacity=near.toFixed(3);
}
function spring(t){cancelAnimationFrame(raf);
  const tick=()=>{progress+=(t-progress)*.18;
    if(Math.abs(t-progress)<.0015){progress=t;render();return;}render();raf=requestAnimationFrame(tick);};tick();}

let dragging=false;
function p2p(x){const s=scaleEl.getBoundingClientRect(),px=x-s.left;
  if(px<=cOf(0))return 0; if(px>=cOf(N-1))return N-1;
  for(let k=0;k<N-1;k++){const a=cOf(k),b=cOf(k+1);if(px>=a&&px<=b)return k+(px-a)/(b-a);} return progress;}
scaleEl.addEventListener('pointerdown',e=>{dragging=true;cancelAnimationFrame(raf);
  scaleEl.setPointerCapture(e.pointerId);progress=p2p(e.clientX);render();});
scaleEl.addEventListener('pointermove',e=>{if(dragging){progress=p2p(e.clientX);render();}});
const ed=()=>{if(!dragging)return;dragging=false;spring(Math.round(progress));};
scaleEl.addEventListener('pointerup',ed);scaleEl.addEventListener('pointercancel',ed);

(function(){let on=false,sx=0,sp=0;const el=document.getElementById('stage');
 el.addEventListener('pointerdown',e=>{on=true;cancelAnimationFrame(raf);el.setPointerCapture(e.pointerId);sx=e.clientX;sp=progress;});
 el.addEventListener('pointermove',e=>{if(!on)return;progress=clamp(sp-(e.clientX-sx)/Math.min(150,innerWidth*.35),-.3,N-.7);render();});
 const up=()=>{if(!on)return;on=false;spring(clamp(Math.round(progress),0,N-1));};
 el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up);})();

document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>{
  document.querySelectorAll('.tab').forEach(x=>x.setAttribute('aria-pressed','false'));
  b.setAttribute('aria-pressed','true');
  document.querySelectorAll('.pane').forEach(p=>p.classList.remove('on'));
  document.getElementById('p-'+b.dataset.pane).classList.add('on');
  document.getElementById('qtitle').textContent={home:'오늘 뭐 먹지?',fridge:'냉장고',hist:'변경 기록'}[b.dataset.pane];
}));

 {nm:'대파',s:2,dd:'품질유지 9/30 · D-2',qt:'1대'},{nm:'애호박',s:2,dd:'소비기한 10/1 · D-3',qt:'1개'},

const sheet=document.getElementById('sheet');let sstep=0;
document.getElementById('mic').onclick=()=>{sstep=0;sheet.classList.add('up');
 document.getElementById('shSt').textContent='듣고 있어요';
 document.getElementById('shUt').textContent='“두부 두 모랑 계란 열 개 넣었어. 두부는 소비기한 10월 3일”';};
document.getElementById('shOk').onclick=()=>{if(sstep===0){sstep=1;

 }else sheet.classList.remove('up');};
document.getElementById('shNo').onclick=()=>sheet.classList.remove('up');

addEventListener('resize',render);
const qi=parseInt(new URLSearchParams(location.search).get('i'),10);
progress=Number.isInteger(qi)?clamp(qi,0,N-1):1;
requestAnimationFrame(render);
