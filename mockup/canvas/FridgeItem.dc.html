        matchStyle: 'align-self: flex-start; font-size: 12px; font-weight: 700; padding: 2px 7px; border-radius: 7px;' + (r.ok ? ' background: ' + K.c26 + '; color: ' + K.c27 + ';' : ' background: ' + K.c28 + '; color: ' + K.c8 + ';') };
    });
    // 삭제는 확인 창을 거친다(앱과 같음). 날짜 종류의 '모름'은 종류가 아니라 날짜가 없는 상태라 '점검 알림'으로 바뀌었다.
    var showDelete = this.props.dialog === 'delete';
    return { K: K, themeName: THEME, FNT: FNT, showDelete: showDelete,
      w: g.w, h: g.h, top: g.top, bottom: g.bottom, isIOS: !android, isAndroid: android,
      qty: qty, locs: locs, dtypes: dtypes, recipes: recipes,
      dtypeLabel: dtype,
      dec: function () { self.setState({ qty: Math.max(0, qty - 1) }); },
      inc: function () { self.setState({ qty: qty + 1 }); },
      links: { fridge: L('Fridge'), menu: L('Menu'), cook: L('CookHome'), item: L('FridgeItem'),
        del: (!android && THEME === 'pastel') ? 'FridgeItem-Delete.dc.html' : L('Fridge') }
    };
  }
}
</script>
</body>
</html>
