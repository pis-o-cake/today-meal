<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>캐릭터</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>@font-face{font-family:'Pretendard';src:url(/_blob/1b43482c59fb171bdbae3b012829170f) format('woff2');font-weight:45 920;font-style:normal;font-display:swap}body{margin:0}</style>
</helmet>
<div style="width: {{size}}px; height: {{size}}px; font-family: 'Pretendard', 'Apple SD Gothic Neo', sans-serif; color: #333A52">
<svg viewBox="0 0 200 200" width="100%" height="100%" role="img" aria-label="{{label}}">
<defs>
<radialGradient id="mg-{{mood}}" cx="0.38" cy="0.3" r="0.8">
<stop offset="0" stop-color="{{light}}"></stop>
<stop offset="0.52" stop-color="{{body}}"></stop>
<stop offset="1" stop-color="{{deep}}"></stop>
</radialGradient>
</defs>
<ellipse cx="100" cy="186" rx="56" ry="7" fill="{{deep}}" opacity="0.22"></ellipse>
<g transform="rotate({{leafRot}} 100 50)">
<path d="M100 52 C100 42 102 34 107 29" fill="none" stroke="{{leaf}}" stroke-width="4" stroke-linecap="round"></path>
<path d="M106 30 C110 16 128 11 137 17 C131 29 117 34 106 30 Z" fill="{{leaf}}"></path>
<path d="M109 28 Q121 22 131 19" fill="none" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="1.6" stroke-linecap="round"></path>
</g>
<path d="M100 46 C148 46 178 80 178 118 C178 154 146 176 100 176 C54 176 22 154 22 118 C22 80 52 46 100 46 Z" fill="url(#mg-{{mood}})"></path>
<path d="M46 150 Q100 184 154 150" fill="none" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="3" stroke-linecap="round"></path>
<ellipse cx="64" cy="82" rx="19" ry="10" fill="#FFFFFF" opacity="0.8" transform="rotate(-32 64 82)"></ellipse>
<circle cx="146" cy="90" r="5" fill="#FFFFFF" opacity="0.55"></circle>
<circle cx="60" cy="134" r="10" fill="#FF7A8A" opacity="{{cheek}}"></circle>
<circle cx="140" cy="134" r="10" fill="#FF7A8A" opacity="{{cheek}}"></circle>
<path d="{{eyeFill}}" fill="#333A52"></path>
<path d="{{eyeStroke}}" fill="none" stroke="#333A52" stroke-width="6" stroke-linecap="round"></path>
<path d="{{eyeShine}}" fill="#FFFFFF"></path>
<path d="{{brow}}" fill="none" stroke="#333A52" stroke-width="5" stroke-linecap="round"></path>
<path d="{{mouthFill}}" fill="#333A52"></path>
<path d="{{mouthStroke}}" fill="none" stroke="#333A52" stroke-width="6" stroke-linecap="round"></path>
<text x="162" y="60" text-anchor="middle" font-size="40" fill="{{deep}}" opacity="{{q}}" font-weight="800" font-family="Pretendard, sans-serif">?</text>
</svg>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"mood":{"editor":"enum","options":["expired","urgent","soon","fresh","unknown","listening","asking","done"],"default":"urgent"},"size":{"editor":"int","default":220,"min":48,"max":400},"$preview":{"width":220,"height":220}}'>
class Component extends DCLogic {
  renderVals() {
    var mood = this.props.mood || 'urgent';
    var size = Number(this.props.size || 220);
    var NONE = 'M0 0';
    var pill = function (cx, cy, h) {
      return 'M' + (cx - 7) + ' ' + (cy - h / 2 + 7) + ' a7 7 0 0 1 14 0 v' + (h - 14) + ' a7 7 0 0 1 -14 0 z';
    };
    var dot = function (cx, cy, r) {
      return 'M' + (cx - r) + ' ' + cy + ' a' + r + ' ' + r + ' 0 1 0 ' + (2 * r) + ' 0 a' + r + ' ' + r + ' 0 1 0 ' + (-2 * r) + ' 0 z';
    };
    var palette = {
      expired:   { light: '#EEF1F5', body: '#C2C9D3', deep: '#8C95A3', leaf: '#A7B19D', leafRot: 58, cheek: 0, label: '지남' },
      urgent:    { light: '#FFE3DA', body: '#FFB3A0', deep: '#F4704E', leaf: '#5FB870', leafRot: -8, cheek: 0.3, label: '급함' },
      soon:      { light: '#FFF1D6', body: '#FFD79B', deep: '#F2A63C', leaf: '#5FB870', leafRot: 0, cheek: 0.3, label: '챙길 것' },
      fresh:     { light: '#E4F8EA', body: '#AEE8BE', deep: '#4FC178', leaf: '#3FAE5E', leafRot: -12, cheek: 0.35, label: '여유' },
      done:      { light: '#E4F8EA', body: '#AEE8BE', deep: '#4FC178', leaf: '#3FAE5E', leafRot: -16, cheek: 0.4, label: '반영했어요' },
      unknown:   { light: '#EEF0F5', body: '#CCD2DE', deep: '#99A2B2', leaf: '#9DB39D', leafRot: 22, cheek: 0.12, label: '미확인' },
      listening: { light: '#E9ECFF', body: '#B9C4FF', deep: '#6F7FF0', leaf: '#5FB870', leafRot: -18, cheek: 0.3, label: '듣고 있어요' },
      asking:    { light: '#FFF1D6', body: '#FFD79B', deep: '#F2A63C', leaf: '#5FB870', leafRot: 10, cheek: 0.25, label: '확인 질문' }
    };
    var c = palette[mood] || palette.urgent;
    var f = { eyeFill: NONE, eyeStroke: NONE, eyeShine: NONE, brow: NONE, mouthFill: NONE, mouthStroke: NONE, q: 0 };
    if (mood === 'fresh' || mood === 'done') {
      f.eyeStroke = 'M70 116 q10 -12 20 0 M110 116 q10 -12 20 0';
      f.mouthStroke = 'M90 134 q10 11 20 0';
    } else if (mood === 'soon') {
      f.eyeFill = pill(80, 114, 24) + ' ' + pill(120, 114, 24);
      f.mouthFill = 'M93 137 h14 a3 3 0 0 1 0 6 h-14 a3 3 0 0 1 0 -6 z';
    } else if (mood === 'urgent') {
      f.eyeFill = pill(80, 116, 24) + ' ' + pill(120, 116, 24);
      f.brow = 'M68 100 L86 94 M132 100 L114 94';
      f.mouthFill = dot(100, 142, 6);
    } else if (mood === 'expired') {
      f.eyeStroke = 'M71 117 h18 M111 117 h18';
      f.mouthStroke = 'M94 140 h12';
    } else if (mood === 'unknown') {
      f.eyeFill = dot(80, 115, 6) + ' ' + dot(120, 115, 6);
      f.mouthStroke = 'M93 140 q7 -4 14 0';
      f.q = 1;
    } else if (mood === 'listening') {
      f.eyeFill = dot(80, 113, 9.5) + ' ' + dot(120, 113, 9.5);
      f.eyeShine = dot(84, 109, 3) + ' ' + dot(124, 109, 3);
      f.mouthFill = 'M92 139 a8 9 0 1 0 16 0 a8 9 0 1 0 -16 0 z';
    } else if (mood === 'asking') {
      f.eyeFill = pill(80, 116, 22) + ' ' + pill(120, 116, 22);
      f.brow = 'M68 98 q9 -8 18 -3 M114 99 h18';
      f.mouthStroke = 'M92 140 q8 -5 16 0';
      f.q = 1;
    }
    return {
      mood: mood, size: size, label: c.label,
      light: c.light, body: c.body, deep: c.deep, leaf: c.leaf, leafRot: c.leafRot, cheek: c.cheek,
      eyeFill: f.eyeFill, eyeStroke: f.eyeStroke, eyeShine: f.eyeShine, brow: f.brow,
      mouthFill: f.mouthFill, mouthStroke: f.mouthStroke, q: f.q
    };
  }
}
</script>
</body>
</html>
