    var a = rx - 36, b = ry - 36;
    var xs = [0.13, 0.315, 0.5, 0.685, 0.87];

    var st = this.state || {};
    var sel = (st.sel === undefined || st.sel === null) ? 1 : st.sel;
    var self = this;
    var tokens = bands.map(function (bd, i) {
      var on = i === sel;
      var x = g.w * xs[i];
      var u = (x - g.w / 2) / a;
      var root = Math.sqrt(1 - u * u);
      var y = ecy - b * root;
      var rot = Math.atan((b * u) / (a * root)) * 180 / Math.PI;
      return {
        face: faceLine[bd.key], color: on ? bd.acc : K.c36,
        aria: bd.word + ' ' + bd.count + '가지', pressed: on ? 'true' : 'false',
        pick: function () { self.setState({ sel: i }); },
        style: 'position: absolute; left: ' + r1(x - 26) + 'px; top: ' + r1(y - 26) + 'px; width: 52px; height: 52px; padding: 0; border: 0; border-radius: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center;'
          + ' transform: rotate(' + r1(rot) + 'deg);'
          + ' background: ' + (on ? K.c37 : 'transparent') + ';'
          + ' box-shadow: ' + (on ? '0 10px 22px ' + K.c38 + ', 0 1px 3px ' + K.c12 + '' : 'none') + ';'
          + (on && THEME === 'glass' ? ' border-radius: 26px; border: 1px solid hsla(0,0%,100%,0.85); background: radial-gradient(circle at 30% 24%, hsla(0,0%,100%,0.85) 0%, hsla(0,0%,100%,0.28) 45%, hsla(0,0%,100%,0.1) 100%); box-shadow: inset 1px 1px 1px hsla(0,0%,100%,1), inset -2px -3px 6px hsla(230,30%,20%,0.08), 0 0 0 0.5px hsla(230,20%,20%,0.15), 0 10px 22px hsla(230,30%,20%,0.16); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);' : '')
      };
    });
    var band = bands[sel];
    band.noMore = !band.more;
    // 글래스 테마 전용: 떠 있는 유리 탭 바 (색은 hsl로 적어 테마 변환에서 제외)
    var GLASS_ON = THEME === 'glass';
    var gNav = function (bottomPx) {
      return 'left: 14px; right: 14px; bottom: ' + bottomPx + 'px; height: 62px; padding: 0 6px; border-radius: 31px; border: 1px solid hsla(0,0%,100%,0.75);'
        + ' background: linear-gradient(135deg, hsla(0,0%,100%,0.42) 0%, hsla(0,0%,100%,0.1) 50%, hsla(0,0%,100%,0.26) 100%);'
        + ' backdrop-filter: blur(14px) saturate(190%); -webkit-backdrop-filter: blur(14px) saturate(190%);'
        + ' box-shadow: inset 1px 1px 0 hsla(0,0%,100%,0.95), inset -1px -1px 0 hsla(0,0%,100%,0.45), inset 0 -12px 20px hsla(0,0%,100%,0.2), 0 0 0 0.5px hsla(230,20%,20%,0.15), 0 12px 30px hsla(230,30%,20%,0.13)';
    };
    var gTab = 'margin: 7px 0; border-radius: 24px; background: linear-gradient(135deg, hsla(0,0%,100%,0.72) 0%, hsla(0,0%,100%,0.22) 55%, hsla(0,0%,100%,0.4) 100%);'
      + ' box-shadow: inset 1px 1px 0 hsla(0,0%,100%,1), inset -1px -1px 0 hsla(0,0%,100%,0.5), 0 0 0 0.5px hsla(230,20%,20%,0.12), 0 4px 12px hsla(230,30%,20%,0.10)';

    var selX = g.w * xs[sel], selU = (selX - g.w / 2) / a, selY = ecy - b * Math.sqrt(1 - selU * selU);
    var hx = String(band.acc).replace('#', ''), hn = parseInt(hx.length === 6 ? hx : '8A94A8', 16);
    var tint = function (al) { return 'rgb' + 'a(' + ((hn >> 16) & 255) + ',' + ((hn >> 8) & 255) + ',' + (hn & 255) + ',' + al + ')'; };
    var gOval = 'border: 1px solid hsla(0,0%,100%,0.85); background: linear-gradient(180deg, hsla(0,0%,100%,0.42) 0%, hsla(0,0%,100%,0.1) 42%, hsla(0,0%,100%,0.05) 100%);'
      + ' backdrop-filter: blur(16px) saturate(190%); -webkit-backdrop-filter: blur(16px) saturate(190%);'
      + ' box-shadow: inset 0 2px 1px hsla(0,0%,100%,1), inset 0 14px 24px hsla(0,0%,100%,0.32), 0 -1px 0 hsla(230,20%,20%,0.14), 0 -14px 36px hsla(230,30%,20%,0.10)';
    var gGlow = 'position: absolute; left: ' + r1(selX - 80) + 'px; top: ' + r1(selY - 64) + 'px; width: 160px; height: 128px; border-radius: 50%;'
      + ' background: radial-gradient(closest-side, ' + tint(0.42) + ', ' + tint(0) + ');';
    return { K: K, themeName: THEME, rootBg: K['root_' + band.key], g_nav: GLASS_ON ? gNav(8) : '', g_tab: GLASS_ON ? gTab : '', g_on: GLASS_ON, g_oval: GLASS_ON ? gOval : '', g_glow: gGlow,
      w: g.w, h: g.h, top: g.top, bottom: g.bottom,
      c1: !c2 && !c3, c2: c2, c3: c3,
      mascotSize: g.mascot, mascotHint: g.mascot + 'px,' + g.mascot + 'px',
      ovalLeft: r1(g.w / 2 - rx), ovalW: r1(rx * 2), ovalH: ry * 2,
      band: band, wordSize: band.word.length > 7 ? 40 : 46, tokens: tokens, links: links
    };
  }
}
</script>
</body>
