<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>뭐 먹지? 탭 아이콘 시안</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>@font-face{font-family:'Pretendard';src:url(/_blob/1b43482c59fb171bdbae3b012829170f) format('woff2');font-weight:45 920;font-style:normal;font-display:swap}@font-face{font-family:'Jua';src:url(/_blob/b80c3f239a19ae2ac0629973c9271ec7) format('woff2');font-weight:400;font-style:normal;font-display:swap}body{margin:0}</style>
</helmet>
<div style="width: 1240px; height: 400px; box-sizing: border-box; padding: 40px 48px; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 24px; font-family: 'Pretendard', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; color: #15181D; letter-spacing: -0.02em; background: #F6F6F9">
  <sc-for list="{{cands}}" as="c" hint-placeholder-count="5">
    <div style="{{c.cardStyle}}">
      <sc-if value="{{c.picked}}" hint-placeholder-val="{{ false }}">
        <span style="position: absolute; top: 12px; right: 12px; display: flex; align-items: center; gap: 4px; height: 26px; padding: 0 10px; border-radius: 13px; background: #5A6BEA; color: #FFFFFF; font-size: 12px; font-weight: 800">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>
          적용
        </span>
      </sc-if>
      <div style="width: 96px; height: 96px; border-radius: 28px; background: #F3F4F8; display: flex; align-items: center; justify-content: center; color: #15181D">
        <svg width="60" height="60" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{c.d}}"></path></svg>
      </div>
      <div style="display: flex; align-items: center; gap: 8px">
        <span style="width: 26px; height: 26px; border-radius: 50%; background: #15181D; color: #FFFFFF; font-size: 13px; font-weight: 800; display: flex; align-items: center; justify-content: center">{{c.key}}</span>
        <span style="font-size: 16px; font-weight: 700">{{c.name}}</span>
      </div>
      <div aria-label="탭 바에 넣었을 때" style="width: 100%; display: flex; height: 58px; box-sizing: border-box; padding: 0 2px; border-radius: 18px; background: #F3F4F8">
        <div style="flex-grow: 1; flex-basis: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: #15181D; font-size: 10px; font-weight: 700; white-space: nowrap">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{c.d}}"></path></svg>
          뭐 먹지?
        </div>
        <div style="flex-grow: 1; flex-basis: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: #8A9199; font-size: 10px; font-weight: 500">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="2.5" width="14" height="19" rx="3"></rect><path d="M5 10h14M8.5 6v1.5M8.5 13v3"></path></svg>
          냉장고
        </div>
        <div style="flex-grow: 1; flex-basis: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: #8A9199; font-size: 10px; font-weight: 500">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>
          기록
        </div>
        <div style="flex-grow: 1; flex-basis: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: #8A9199; font-size: 9px; font-weight: 500; letter-spacing: -0.05em; white-space: nowrap">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4.5 20.5a7.5 7.5 0 0 1 15 0"></path></svg>
          마이페이지
        </div>
      </div>
    </div>
  </sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1240,"height":400}}'>
class Component extends DCLogic {
  renderVals() {
    var base = 'position: relative; display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 24px 14px 18px; border-radius: 24px; background: #FFFFFF; box-sizing: border-box; ';
    var list = [
        { key: 'A', name: '수저', d: 'M5 6.5a3 4 0 1 0 6 0a3 4 0 1 0 -6 0 M8 10.5V21 M15 3l.5 18 M19 3l-1 18' },
        { key: 'B', name: '물음표 말풍선', d: 'M4 5.5A2.5 2.5 0 0 1 6.5 3h11A2.5 2.5 0 0 1 20 5.5v8a2.5 2.5 0 0 1-2.5 2.5H11l-4.5 4v-4A2.5 2.5 0 0 1 4 13.5z M10 8a2 2 0 1 1 2.8 1.8c-.5.3-.8.7-.8 1.2 M12 13.3v.1' },
        { key: 'C', name: '소복한 밥그릇', d: 'M3 12h18a9 9 0 0 1-18 0z M6.5 12a5.5 4.5 0 0 1 11 0 M19 2.5l.7 1.6 1.6.7-1.6.7-.7 1.6-.7-1.6-1.6-.7 1.6-.7z' },
        { key: 'D', name: '뚜껑 덮인 접시', d: 'M4 17a8 8 0 0 1 16 0 M12 9V7 M10.5 7h3 M2.5 17h19 M5 20.5h14' },
        { key: 'E', name: '끓는 냄비', d: 'M5 11h14v6a3 3 0 0 1-3 3H8a3 3 0 0 1-3-3z M3.5 11h17 M10 8.5h4 M3 13.5h2 M19 13.5h2 M9.5 6c0-1.2 1-1.3 1-2.5 M13.5 6c0-1.2 1-1.3 1-2.5' }
    ];
    return {
      cands: list.map(function (c) {
        var picked = c.key === 'A';
        return { key: c.key, name: c.name, d: c.d, picked: picked,
          cardStyle: base + (picked ? 'border: 2px solid #5A6BEA; box-shadow: 0 12px 28px rgba(90,107,234,0.22)' : 'border: 2px solid transparent; box-shadow: 0 8px 24px rgba(20,25,35,0.06); opacity: 0.6') };
      })
    };
  }
}
</script>
</body>
</html>
