<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>캐릭터 시안 3</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>@font-face{font-family:'Pretendard';src:url(/_blob/1b43482c59fb171bdbae3b012829170f) format('woff2');font-weight:45 920;font-style:normal;font-display:swap}@font-face{font-family:'Jua';src:url(/_blob/b80c3f239a19ae2ac0629973c9271ec7) format('woff2');font-weight:400;font-style:normal;font-display:swap}body{margin:0}</style>
</helmet>
<div style="width: {{size}}px; height: {{size}}px; font-family: 'Pretendard', 'Apple SD Gothic Neo', sans-serif; color: #333A52">
<svg viewBox="0 0 200 200" width="100%" height="100%" role="img" aria-label="{{label}}">
<defs>
<linearGradient id="bw-{{mood}}" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="{{light}}"></stop>
<stop offset="0.55" stop-color="{{body}}"></stop>
<stop offset="1" stop-color="{{deep}}"></stop>
</linearGradient>
<radialGradient id="rice-{{mood}}" cx="0.4" cy="0.3" r="0.8">
<stop offset="0" stop-color="#FFFFFF"></stop>
<stop offset="1" stop-color="#EFE7D6"></stop>
</radialGradient>
</defs>
<ellipse cx="100" cy="186" rx="56" ry="6" fill="#333A52" opacity="0.12"></ellipse>
<g opacity="{{steam}}" fill="none" stroke="{{steamColor}}" stroke-width="4" stroke-linecap="round">
<path d="M78 48 q-7 -8 0 -16 q7 -8 0 -16"></path>
<path d="M100 42 q-7 -8 0 -16 q7 -8 0 -16"></path>
<path d="M122 48 q-7 -8 0 -16 q7 -8 0 -16"></path>
</g>
<path d="M36 104 Q40 60 100 56 Q160 60 164 104 Z" fill="url(#rice-{{mood}})"></path>
<g fill="#FFFFFF" stroke="#E4DAC6" stroke-width="1">
<ellipse cx="72" cy="86" rx="5" ry="3" transform="rotate(-20 72 86)"></ellipse>
<ellipse cx="92" cy="72" rx="5" ry="3" transform="rotate(15 92 72)"></ellipse>
<ellipse cx="114" cy="78" rx="5" ry="3" transform="rotate(-10 114 78)"></ellipse>
<ellipse cx="134" cy="92" rx="5" ry="3" transform="rotate(25 134 92)"></ellipse>
<ellipse cx="102" cy="94" rx="5" ry="3" transform="rotate(-35 102 94)"></ellipse>
<ellipse cx="56" cy="98" rx="4.5" ry="2.8" transform="rotate(10 56 98)"></ellipse>
</g>
<path d="M76 168 H124 L119 180 H81 Z" fill="{{deep}}"></path>
<path d="M28 104 Q30 170 100 172 Q170 170 172 104 Z" fill="url(#bw-{{mood}})"></path>
<path d="M28 104 Q100 116 172 104" fill="none" stroke="#FFFFFF" stroke-opacity="0.7" stroke-width="3" stroke-linecap="round"></path>
<path d="M38 124 Q100 138 162 124" fill="none" stroke="{{deep}}" stroke-opacity="0.3" stroke-width="4" stroke-linecap="round"></path>
<path d="M44 116 Q46 140 60 156" fill="none" stroke="#FFFFFF" stroke-opacity="0.45" stroke-width="5" stroke-linecap="round"></path>
<circle cx="66" cy="152" r="7" fill="#FF7A8A" opacity="{{cheek}}"></circle>
<circle cx="134" cy="152" r="7" fill="#FF7A8A" opacity="{{cheek}}"></circle>
<path d="{{eyeFill}}" fill="#333A52"></path>
<path d="{{eyeStroke}}" fill="none" stroke="#333A52" stroke-width="4.5" stroke-linecap="round"></path>
<path d="{{eyeShine}}" fill="#FFFFFF"></path>
<path d="{{brow}}" fill="none" stroke="#333A52" stroke-width="4" stroke-linecap="round"></path>
<path d="{{mouthFill}}" fill="#333A52"></path>
<path d="{{mouthStroke}}" fill="none" stroke="#333A52" stroke-width="4.5" stroke-linecap="round"></path>
<path d="M160 58 c-6 9 -9 14 -9 18 a9 9 0 0 0 18 0 c0 -4 -3 -9 -9 -18 z" fill="#8CC8FF" opacity="{{sweat}}"></path>
<g fill="{{deep}}" opacity="{{spark}}">
<path d="M162 50 l3 8 8 3 -8 3 -3 8 -3 -8 -8 -3 8 -3 z"></path>
<path d="M36 60 l2.2 6 6 2.2 -6 2.2 -2.2 6 -2.2 -6 -6 -2.2 6 -2.2 z"></path>
</g>
<path d="M168 70 q7 9 0 18 M177 63 q12 16 0 32" fill="none" stroke="{{deep}}" stroke-width="4.5" stroke-linecap="round" opacity="{{waves}}"></path>
<text x="160" y="64" text-anchor="middle" font-size="36" font-weight="800" fill="{{deep}}" font-family="Pretendard, sans-serif" opacity="{{q}}">?</text>
</svg>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"mood":{"editor":"enum","options":["expired","urgent","soon","fresh","unknown","listening","asking","done"],"default":"urgent"},"size":{"editor":"int","default":220,"min":48,"max":400},"$preview":{"width":220,"height":220}}'>
class Component extends DCLogic {
  renderVals() {
    var mood = this.props.mood || 'urgent';
    var size = Number(this.props.size || 220);
    var NONE = 'M0 0';
    var dot = function (cx, cy, r) {
      return 'M' + (cx - r) + ' ' + cy + ' a' + r + ' ' + r + ' 0 1 0 ' + (2 * r) + ' 0 a' + r + ' ' + r + ' 0 1 0 ' + (-2 * r) + ' 0 z';
    };
    var palette = {
      expired:   { light: '#E6E9EE', body: '#C9CED6', deep: '#9AA2AE', cheek: 0, steam: 0, label: '지남' },
      urgent:    { light: '#FFD3C6', body: '#FF9E86', deep: '#E0603F', cheek: 0.35, steam: 0.55, label: '급함' },
      soon:      { light: '#FFE6BA', body: '#FFC870', deep: '#D99526', cheek: 0.35, steam: 0.55, label: '챙길 것' },
      fresh:     { light: '#D3F1DC', body: '#8FD9A5', deep: '#3FAE5E', cheek: 0.4, steam: 0.7, label: '여유' },
      done:      { light: '#D3F1DC', body: '#8FD9A5', deep: '#3FAE5E', cheek: 0.45, steam: 0.7, label: '반영했어요' },
      unknown:   { light: '#E3E6ED', body: '#BFC6D3', deep: '#8A94A8', cheek: 0.15, steam: 0.3, label: '미확인' },
      listening: { light: '#D8DEFF', body: '#9FAEFF', deep: '#5A6BEA', cheek: 0.35, steam: 0.6, label: '듣고 있어요' },
      asking:    { light: '#FFE6BA', body: '#FFC870', deep: '#D99526', cheek: 0.3, steam: 0.4, label: '확인 질문' }
    };
    var c = palette[mood] || palette.urgent;
    var f = { eyeFill: NONE, eyeStroke: NONE, eyeShine: NONE, brow: NONE, mouthFill: NONE, mouthStroke: NONE, sweat: 0, spark: 0, waves: 0, q: 0 };
    if (mood === 'fresh' || mood === 'done') {
      f.eyeStroke = 'M77 143 q7 -8 14 0 M109 143 q7 -8 14 0';
      f.mouthStroke = 'M93 153 q7 7 14 0';
      f.spark = 0.8;
    } else if (mood === 'soon') {
      f.eyeFill = dot(84, 141, 5) + ' ' + dot(116, 141, 5);
      f.mouthFill = 'M94 153 h12 a2.5 2.5 0 0 1 0 5 h-12 a2.5 2.5 0 0 1 0 -5 z';
    } else if (mood === 'urgent') {
      f.eyeFill = dot(84, 142, 5.5) + ' ' + dot(116, 142, 5.5);
      f.brow = 'M75 130 L90 126 M125 130 L110 126';
      f.mouthFill = dot(100, 158, 4);
      f.sweat = 0.9;
    } else if (mood === 'expired') {
      f.eyeStroke = 'M78 143 h12 M110 143 h12';
      f.mouthStroke = 'M95 157 h10';
    } else if (mood === 'unknown') {
      f.eyeFill = dot(84, 142, 4.5) + ' ' + dot(116, 142, 4.5);
      f.mouthStroke = 'M94 157 q6 -3 12 0';
      f.q = 1;
    } else if (mood === 'listening') {
      f.eyeFill = dot(84, 140, 7) + ' ' + dot(116, 140, 7);
      f.eyeShine = dot(86.5, 137, 2.2) + ' ' + dot(118.5, 137, 2.2);
      f.mouthFill = 'M94 155 a6 7 0 1 0 12 0 a6 7 0 1 0 -12 0 z';
      f.waves = 1;
    } else if (mood === 'asking') {
      f.eyeFill = dot(84, 142, 5) + ' ' + dot(116, 142, 5);
      f.brow = 'M76 128 q7 -6 14 -2 M110 130 h14';
      f.mouthStroke = 'M93 158 q7 -4 14 0';
      f.q = 1;
    }
    return {
      mood: mood, size: size, label: c.label,
      light: c.light, body: c.body, deep: c.deep, cheek: c.cheek,
      steam: c.steam, steamColor: mood === 'expired' ? '#B8BFCA' : '#C9D2E0',
      eyeFill: f.eyeFill, eyeStroke: f.eyeStroke, eyeShine: f.eyeShine, brow: f.brow,
      mouthFill: f.mouthFill, mouthStroke: f.mouthStroke,
      sweat: f.sweat, spark: f.spark, waves: f.waves, q: f.q
    };
  }
}
</script>
</body>
</html>
