<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>기록</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>@font-face{font-family:'Pretendard';src:url(/_blob/1b43482c59fb171bdbae3b012829170f) format('woff2');font-weight:45 920;font-style:normal;font-display:swap}body{margin:0}</style>
</helmet>
<div style="position: relative; width: {{w}}px; height: {{h}}px; box-sizing: border-box; padding-top: {{top}}px; overflow: hidden; display: flex; flex-direction: column; font-family: 'Pretendard', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; color: #15181D; letter-spacing: -0.02em; background: radial-gradient(125% 70% at 50% 0%, #FFFFFF 0%, #F6F7F9 45%, #E8EBF0 100%)">

  <header style="display: flex; flex-direction: column; gap: 6px; padding: 12px 20px 0">
    <div style="display: flex; align-items: center; justify-content: space-between">
      <h1 style="margin: 0; font-size: 30px; line-height: 1.2; font-weight: 700; letter-spacing: -0.04em">기록</h1>
      <div style="display: flex; align-items: center; gap: 6px; height: 36px; box-sizing: border-box; padding: 0 12px; border-radius: 999px; background: rgba(255,255,255,0.8); border: 1px solid rgba(255,255,255,0.95); box-shadow: 0 4px 12px rgba(20,25,35,0.06); font-size: 13px; font-weight: 700">
        <span style="width: 7px; height: 7px; border-radius: 50%; background: #3F4FD1; box-shadow: 0 0 0 3px rgba(63,79,209,0.18)"></span>
        호출 대기 중
      </div>
    </div>
    <div style="font-size: 15px; font-weight: 500; color: #5F6670">잘못 반영됐으면 바로 되돌릴 수 있어요</div>
  </header>

  <div style="flex-grow: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; gap: 8px; padding: 18px 20px 0">
    <div style="font-size: 13px; font-weight: 700; color: #5F6670">오늘 · 계란</div>
    <div style="display: flex; flex-direction: column; border-radius: 22px; background: rgba(255,255,255,0.86); border: 1px solid rgba(255,255,255,0.95); box-shadow: 0 6px 18px rgba(20,25,35,0.06)">
      <sc-for list="{{rows}}" as="r" hint-placeholder-count="5">
        <div style="{{r.rowStyle}}">
          <span style="width: 40px; flex-shrink: 0; padding-top: 4px; font-size: 13px; font-weight: 600; color: #5F6670; font-variant-numeric: tabular-nums">{{r.time}}</span>
          <div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 5px">
            <div style="display: flex; align-items: center; gap: 8px">
              <span style="{{r.badgeStyle}}">{{r.kind}}</span>
              <span style="font-size: 16px; font-weight: 700">{{r.title}}</span>
            </div>
            <span style="font-size: 14px; font-weight: 500; color: #5F6670">{{r.quote}}</span>
            <sc-if value="{{r.hasTags}}" hint-placeholder-val="{{ true }}">
              <div style="display: flex; flex-wrap: wrap; gap: 6px">
                <sc-for list="{{r.tags}}" as="tg" hint-placeholder-count="1">
                  <span style="font-size: 12px; font-weight: 700; padding: 2px 7px; border-radius: 6px; background: #ECEEF2; color: #4E5661">{{tg}}</span>
                </sc-for>
              </div>
            </sc-if>
            <sc-if value="{{r.undo}}" hint-placeholder-val="{{ false }}">
              <button type="button" style="align-self: flex-start; display: flex; align-items: center; gap: 6px; height: 44px; margin-top: 4px; padding: 0 16px; border-radius: 22px; border: 0; background: #15181D; color: #FFFFFF; font-family: inherit; font-size: 14px; font-weight: 700; cursor: pointer">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9h10a5 5 0 0 1 0 10H8"></path><path d="M8 5L4 9l4 4"></path></svg>
                되돌리기
              </button>
            </sc-if>
          </div>
          <div style="display: flex; flex-direction: column; align-items: flex-end; flex-shrink: 0">
            <span style="font-size: 13px; font-weight: 600; color: #5F6670">{{r.from}} →</span>
            <span style="font-size: 22px; font-weight: 700; letter-spacing: -0.04em">{{r.to}}</span>
          </div>
        </div>
      </sc-for>
    </div>
  </div>

  <nav aria-label="주요 화면" style="position: absolute; left: 0; right: 0; bottom: 0; display: flex; align-items: center; gap: 12px; padding: 24px 16px {{navBottom}}px; background: linear-gradient(to bottom, rgba(232,235,240,0) 0%, rgba(232,235,240,0.92) 40%)">
    <div style="flex-grow: 1; display: flex; gap: 4px; height: 64px; box-sizing: border-box; padding: 6px; border-radius: 32px; background: rgba(255,255,255,0.84); border: 1px solid rgba(255,255,255,0.95); box-shadow: 0 10px 28px rgba(20,25,35,0.1)">
      <a href="{{links.home}}" style="flex-grow: 1; flex-basis: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; border-radius: 26px; color: #5F6670; text-decoration: none; font-size: 12px; font-weight: 600">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11h18a9 9 0 0 1-18 0z"></path><path d="M9.5 3.5c0 1.5 1.5 1.5 1.5 3M13.5 3.5c0 1.5 1.5 1.5 1.5 3"></path></svg>
        오늘
      </a>
      <a href="{{links.fridge}}" style="flex-grow: 1; flex-basis: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; border-radius: 26px; color: #5F6670; text-decoration: none; font-size: 12px; font-weight: 600">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="2.5" width="14" height="19" rx="2.5"></rect><path d="M5 10h14M8.5 6v1.5M8.5 13v3"></path></svg>
        냉장고
      </a>
      <a href="{{links.history}}" aria-current="page" style="flex-grow: 1; flex-basis: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; border-radius: 26px; background: #FFFFFF; color: #15181D; text-decoration: none; font-size: 12px; font-weight: 700; box-shadow: 0 4px 12px rgba(20,25,35,0.08)">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>
        기록
      </a>
    </div>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"platform":{"editor":"enum","options":["ios","android"],"default":"ios"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var android = (this.props.platform || 'ios') === 'android';
    var g = android ? { w: 412, h: 915, top: 40, bottom: 24 } : { w: 390, h: 844, top: 59, bottom: 34 };
    var L = function (n) { return (android ? 'Android-' : '') + n + '.dc.html'; };
    var kinds = {
      '입고': ['#DDF3E4', '#17703C'],
      '사용': ['#E4E8FF', '#3346B8'],
      '정정': ['#FFEBC7', '#8F5A08'],
      '취소': ['#ECEEF2', '#4E5661'],
      '보정': ['#F0E6FD', '#6B35B0']
    };
    var raw = [
      { time: '19:09', kind: '보정', title: '계란을 4개로 맞췄어요', quote: '“계란 네 개 남았어”', tags: ['명시값'], from: '8', to: '4개', undo: true },
      { time: '19:07', kind: '취소', title: '정정을 되돌렸어요', quote: '“방금 거 취소”', tags: [], from: '7', to: '8개' },
      { time: '19:06', kind: '정정', title: '사용량 2개 → 3개', quote: '“두 개가 아니라 세 개”', tags: ['명시값', '추가 차감 없음'], from: '8', to: '7개' },
      { time: '19:05', kind: '사용', title: '계란 2개', quote: '“계란 두 개 썼어”', tags: ['명시값'], from: '10', to: '8개' },
      { time: '19:02', kind: '입고', title: '계란 10개 · 두부 2모', quote: '“두부 두 모랑 계란 열 개 넣었어…”', tags: ['명시값'], from: '0', to: '10개' }
    ];
    var rows = raw.map(function (r, i) {
      var k = kinds[r.kind];
      return {
        time: r.time, kind: r.kind, title: r.title, quote: r.quote, tags: r.tags, hasTags: r.tags.length > 0,
        from: r.from, to: r.to, undo: !!r.undo,
        badgeStyle: 'font-size: 12px; font-weight: 700; padding: 3px 8px; border-radius: 7px; background: ' + k[0] + '; color: ' + k[1],
        rowStyle: 'display: flex; align-items: flex-start; gap: 10px; padding: 14px 16px;' + (i > 0 ? ' border-top: 1px solid rgba(21,24,29,0.07);' : '')
      };
    });
    return {
      w: g.w, h: g.h, top: g.top, navBottom: g.bottom + 8,
      rows: rows,
      links: { home: L('Main'), fridge: L('Fridge'), history: L('History'), listen: L('Listening') }
    };
  }
}
</script>
</body>
</html>
