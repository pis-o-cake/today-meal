<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>확인 질문</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>@font-face{font-family:'Pretendard';src:url(/_blob/1b43482c59fb171bdbae3b012829170f) format('woff2');font-weight:45 920;font-style:normal;font-display:swap}body{margin:0}</style>
</helmet>
<div style="position: relative; width: {{w}}px; height: {{h}}px; box-sizing: border-box; padding-top: {{top}}px; padding-bottom: {{bottom}}px; overflow: hidden; display: flex; flex-direction: column; font-family: 'Pretendard', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; color: #15181D; letter-spacing: -0.02em; background: radial-gradient(125% 80% at 50% 26%, #FFFFFF 0%, #FFFAF0 40%, #FFE6BA 100%)">

  <div style="display: grid; grid-template-columns: 44px 1fr 44px; align-items: center; padding: 8px 16px 0">
    <div></div>
    <ol aria-label="진행 단계" style="justify-self: center; list-style: none; margin: 0; display: flex; gap: 4px; padding: 4px; border-radius: 22px; background: rgba(255,255,255,0.74); border: 1px solid rgba(255,255,255,0.95); box-shadow: 0 6px 18px rgba(20,25,35,0.07)">
      <li style="display: flex; align-items: center; gap: 4px; height: 34px; padding: 0 12px; border-radius: 17px; color: #1B7F43; font-size: 13px; font-weight: 700">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>
        듣기
      </li>
      <li aria-current="step" style="display: flex; align-items: center; height: 34px; padding: 0 14px; border-radius: 17px; background: #15181D; color: #FFFFFF; font-size: 13px; font-weight: 700">확인</li>
      <li style="display: flex; align-items: center; height: 34px; padding: 0 14px; border-radius: 17px; color: #5F6670; font-size: 13px; font-weight: 600">반영</li>
    </ol>
    <a href="{{links.home}}" aria-label="닫기" style="width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #3E454E; background: rgba(255,255,255,0.74); border: 1px solid rgba(255,255,255,0.95); box-sizing: border-box; text-decoration: none">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
    </a>
  </div>

  <div style="display: flex; align-items: center; gap: 10px; margin: 14px 20px 0; min-height: 52px; box-sizing: border-box; padding: 4px 6px 4px 14px; border-radius: 18px; background: rgba(255,255,255,0.78); border: 1px solid rgba(255,255,255,0.95); box-shadow: 0 6px 18px rgba(20,25,35,0.06)">
    <span style="width: 24px; height: 24px; flex-shrink: 0; border-radius: 50%; background: #1B7F43; color: #FFFFFF; display: flex; align-items: center; justify-content: center">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>
    </span>
    <span style="flex-grow: 1; font-size: 15px; font-weight: 600">계란 10개는 먼저 반영했어요</span>
    <button type="button" style="height: 44px; padding: 0 12px; border: 0; background: transparent; font-family: inherit; font-size: 14px; font-weight: 700; color: #3E454E; cursor: pointer">되돌리기</button>
  </div>

  <main style="flex-grow: 1; min-height: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 0 24px; text-align: center">
    <sc-if value="{{c1}}" hint-placeholder-val="{{ true }}">
      <dc-import name="Mascot" mood="asking" size="{{mascotSize}}" hint-size="{{mascotHint}}"></dc-import>
    </sc-if>
    <sc-if value="{{c2}}" hint-placeholder-val="{{ false }}">
      <dc-import name="Mascot2" mood="asking" size="{{mascotSize}}" hint-size="{{mascotHint}}"></dc-import>
    </sc-if>
    <sc-if value="{{c3}}" hint-placeholder-val="{{ false }}">
      <dc-import name="Mascot3" mood="asking" size="{{mascotSize}}" hint-size="{{mascotHint}}"></dc-import>
    </sc-if>
    <div style="font-size: 32px; line-height: 1.15; font-weight: 800; letter-spacing: -0.05em; color: #9A5B00; margin-top: 4px">한 가지만 확인할게요</div>
    <h1 style="margin: 12px 0 0; font-size: 23px; line-height: 1.4; font-weight: 700; letter-spacing: -0.035em; white-space: pre-line">두부의 10월 3일은
어떤 날짜예요?</h1>
    <div style="font-size: 14px; font-weight: 500; color: #5F6670; margin-top: 8px">종류를 모르면 소비기한으로 바꾸지 않아요</div>
  </main>

  <div role="group" aria-label="날짜 종류" style="display: flex; flex-direction: column; gap: 10px; padding: 16px 20px 0">
    <a href="{{links.result}}" style="display: flex; align-items: center; gap: 12px; height: 60px; box-sizing: border-box; padding: 0 18px; border-radius: 20px; background: #FFFFFF; border: 2px solid #9A5B00; color: #15181D; text-decoration: none; box-shadow: 0 8px 20px rgba(20,25,35,0.08)">
      <span style="width: 22px; height: 22px; box-sizing: border-box; border-radius: 50%; border: 6px solid #9A5B00; flex-shrink: 0"></span>
      <span style="flex-grow: 1; font-size: 17px; font-weight: 700">소비기한</span>
      <span style="font-size: 13px; font-weight: 600; color: #5F6670">“소비기한이야”</span>
    </a>
    <a href="{{links.result}}" style="display: flex; align-items: center; gap: 12px; height: 60px; box-sizing: border-box; padding: 0 18px; border-radius: 20px; background: rgba(255,255,255,0.78); border: 1px solid rgba(255,255,255,0.95); color: #15181D; text-decoration: none; box-shadow: 0 6px 18px rgba(20,25,35,0.06)">
      <span style="width: 22px; height: 22px; box-sizing: border-box; border-radius: 50%; border: 2px solid #A2A8B0; flex-shrink: 0"></span>
      <span style="flex-grow: 1; font-size: 17px; font-weight: 700">유통기한</span>
    </a>
    <a href="{{links.result}}" style="display: flex; align-items: center; gap: 12px; height: 60px; box-sizing: border-box; padding: 0 18px; border-radius: 20px; background: rgba(255,255,255,0.78); border: 1px solid rgba(255,255,255,0.95); color: #15181D; text-decoration: none; box-shadow: 0 6px 18px rgba(20,25,35,0.06)">
      <span style="width: 22px; height: 22px; box-sizing: border-box; border-radius: 50%; border: 2px solid #A2A8B0; flex-shrink: 0"></span>
      <span style="flex-grow: 1; font-size: 17px; font-weight: 700">잘 모르겠어요</span>
      <span style="font-size: 13px; font-weight: 600; color: #5F6670">미확인으로 둘게요</span>
    </a>
  </div>

  <div style="display: flex; align-items: center; justify-content: center; gap: 10px; padding: 16px 20px 8px">
    <svg width="36" height="36" viewBox="0 0 36 36" aria-hidden="true">
      <circle cx="18" cy="18" r="15" fill="none" stroke="rgba(154,91,0,0.18)" stroke-width="3.5"></circle>
      <circle cx="18" cy="18" r="15" fill="none" stroke="#9A5B00" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="94.2" stroke-dashoffset="18.8" transform="rotate(-90 18 18)"></circle>
      <text x="18" y="23" text-anchor="middle" font-size="14" font-weight="800" fill="#15181D" font-family="Pretendard, sans-serif">8</text>
    </svg>
    <span style="font-size: 14px; font-weight: 600; color: #3E454E">8초 동안은 부르지 않고 바로 말해도 돼요</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"platform":{"editor":"enum","options":["ios","android"],"default":"ios"},"character":{"editor":"enum","options":["1","2","3"],"default":"1"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var android = (this.props.platform || 'ios') === 'android';
    var c2 = String(this.props.character || '1') === '2';
    var c3 = String(this.props.character || '1') === '3';
    var g = android ? { w: 412, h: 915, top: 40, bottom: 24, mascot: 176 } : { w: 390, h: 844, top: 59, bottom: 34, mascot: 140 };
    var L = function (n) { return (android ? 'Android-' : '') + n + '.dc.html'; };
    return {
      w: g.w, h: g.h, top: g.top, bottom: g.bottom,
      c1: !c2 && !c3, c2: c2, c3: c3,
      mascotSize: g.mascot, mascotHint: g.mascot + 'px,' + g.mascot + 'px',
      links: { home: L('Main'), result: L('Result') }
    };
  }
}
</script>
</body>
</html>
