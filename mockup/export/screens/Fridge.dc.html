      { b: 'unknown', name: '계란', num: '4', unit: '개', loc: '냉장', meta: '기한을 말해 주세요', sub: '', fill: -1 },
      { b: 'fresh', name: '다진마늘', num: '1', unit: '통', loc: '냉동', meta: '소비기한 2026.10.24', sub: 'D-22', fill: 82 },
      { b: 'fresh', name: '감자', num: '3', unit: '개', loc: '실온', meta: '점검 알림 2026.10.12', sub: 'D-10', fill: 82 }
    ];
    // 검색 모드: 이름에 검색어가 든 재료만(앱과 같음). 막대 길이는 등급마다 고정이다(지남 6 · 코앞 16 · 며칠 40 · 넉넉 82%).
    var searching = this.props.mode === 'search', query = searching ? '두' : '';
    var items = raw.filter(function (r) { return (loc === '전체' || r.loc === loc) && (status === 'all' || r.b === status) && (!query || r.name.indexOf(query) >= 0); }).map(function (r) {
      var c = band[r.b];
      var track = r.fill < 0
        ? 'height: 6px; margin-top: 12px; box-sizing: border-box; border-radius: 3px; border: 1.5px dashed ' + K.c34 + ''
        : 'height: 6px; margin-top: 12px; border-radius: 3px; background: ' + K.c35 + '; overflow: hidden';
      return {
        name: r.name, num: r.num, unit: r.unit, loc: r.loc, meta: r.meta, sub: r.sub, band: c.word, est: !!r.est, face: FACE[r.b], aria: r.name + ' ' + c.word + ' 자세히 보기',
        subColor: r.warn ? K.c23 : c.fg,
        tagStyle: 'display: inline-flex; align-items: center; gap: 3px; font-size: 12px; font-weight: 700; padding: 3px 7px 3px 5px; border-radius: 8px; white-space: nowrap; letter-spacing: -0.03em; background: ' + c.bg + '; color: ' + c.fg,
        trackStyle: track,
        fillStyle: r.fill < 0 ? 'display: none' : 'height: 100%; width: ' + Math.max(r.fill, 4) + '%; border-radius: 3px; background: ' + (c.bar || K.c21)
      };
    });
    var counts = { '전체': raw.length, '냉장': 0, '냉동': 0, '실온': 0 };
    raw.forEach(function (r) { counts[r.loc] += 1; });
    var filters = ['전체', '냉장', '냉동', '실온'].map(function (name) {
      var on = name === loc;
      return {
        label: name, count: counts[name], pressed: on ? 'true' : 'false',
        pick: function () { self.setState({ loc: name }); },
        style: 'flex-grow: 1; flex-basis: 0; height: 38px; border: 0; border-radius: 19px; cursor: pointer; font-family: inherit; font-size: 14px; letter-spacing: -0.02em;'
          + (on ? ' background: ' + K.c36 + '; color: ' + K.c0 + '; font-weight: 700; box-shadow: 0 4px 12px ' + K.c37 + ';' : ' background: transparent; color: ' + K.c1 + '; font-weight: 500;')
      };
    });
    var sc = { all: raw.filter(function (r) { return loc === '전체' || r.loc === loc; }).length };
    ORDER.forEach(function (k) { sc[k] = raw.filter(function (r) { return r.b === k && (loc === '전체' || r.loc === loc); }).length; });
    var states = [{ key: 'all', label: '전체' }].concat(ORDER.map(function (k) { return { key: k, label: band[k].short }; })).map(function (d) {
      var on = d.key === status;
      var c = band[d.key];
      return {
        label: d.label, count: sc[d.key], hasFace: d.key !== 'all', face: FACE[d.key] || '', faceColor: c ? c.acc : K.c0,
        pressed: on ? 'true' : 'false',
        pick: function () { self.setState({ status: on ? 'all' : d.key }); },
        style: 'flex-shrink: 0; display: flex; align-items: center; gap: 4px; height: 36px; box-sizing: border-box; padding: 0 12px 0 ' + (d.key === 'all' ? 12 : 8) + 'px; border-radius: 18px; cursor: pointer; font-family: inherit; font-size: 13px; letter-spacing: -0.02em;'
          + (on ? (c ? ' background: ' + c.bg + '; border: 1px solid ' + c.bg + '; color: ' + c.fg + '; font-weight: 700;' : ' background: ' + K.c38 + '; border: 1px solid ' + K.c39 + '; color: ' + K.c40 + '; font-weight: 700;')
                : ' background: ' + K.c41 + '; border: 1px solid ' + K.c42 + '; color: ' + K.c5 + '; font-weight: 600;')
      };
    });
    // 글래스 테마 전용: 떠 있는 유리 탭 바 (색은 hsl로 적어 테마 변환에서 제외)
    var GLASS_ON = THEME === 'glass';
    var gNav = function (bottomPx) {
      return 'left: 14px; right: 14px; bottom: ' + bottomPx + 'px; height: 62px; padding: 0 6px; border-radius: 31px; border: 1px solid hsla(0,0%,100%,0.75);'
        + ' background: linear-gradient(135deg, hsla(0,0%,100%,0.42) 0%, hsla(0,0%,100%,0.1) 50%, hsla(0,0%,100%,0.26) 100%);'
        + ' backdrop-filter: blur(14px) saturate(190%); -webkit-backdrop-filter: blur(14px) saturate(190%);'
        + ' box-shadow: inset 1px 1px 0 hsla(0,0%,100%,0.95), inset -1px -1px 0 hsla(0,0%,100%,0.45), inset 0 -12px 20px hsla(0,0%,100%,0.2), 0 0 0 0.5px hsla(230,20%,20%,0.15), 0 12px 30px hsla(230,30%,20%,0.13)';
    };
    var gTab = 'margin: 7px 0; border-radius: 24px; background: linear-gradient(135deg, hsla(0,0%,100%,0.72) 0%, hsla(0,0%,100%,0.22) 55%, hsla(0,0%,100%,0.4) 100%);'
      + ' box-shadow: inset 1px 1px 0 hsla(0,0%,100%,1), inset -1px -1px 0 hsla(0,0%,100%,0.5), 0 0 0 0.5px hsla(230,20%,20%,0.12), 0 4px 12px hsla(230,30%,20%,0.10)';

    return { K: K, themeName: THEME, FNT: FNT, g_nav: GLASS_ON ? gNav(Math.max(g.bottom - 12, 12)) : '', g_tab: GLASS_ON ? gTab : '',
      w: g.w, h: g.h, top: g.top, bottom: g.bottom, navH: 64 + g.bottom,
      filters: filters, items: items, states: states, searching: searching, notSearching: !searching, query: query,
      links: { home: L('Main'), fridge: L('Fridge'), cook: L('CookHome'), history: L('History'), my: L('MyPage'), item: L('FridgeItem'),
        search: (!android && THEME === 'pastel') ? 'Fridge-Search.dc.html' : L('Fridge') }
    };
  }
}
