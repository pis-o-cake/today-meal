<html lang="ko">
<head>
<meta charset="utf-8">
<title>확인 질문</title>

</head>

<helmet>

<div style="position: relative; width: {{w}}px; height: {{h}}px; box-sizing: border-box; padding-top: {{top}}px; padding-bottom: {{bottom}}px; overflow: hidden; display: flex; flex-direction: column; font-family: {{FNT.root}}; font-synthesis: {{FNT.syn}}; color: {{K.c0}}; letter-spacing: -0.02em; background: {{K.root}}">

  <div style="display: flex; align-items: center; gap: 14px; padding: 10px 16px 0 22px">
    <sc-if value="{{hasSteps}}" hint-placeholder-val="{{ true }}">
    <ol aria-label="진행 단계" style="flex-grow: 1; min-width: 0; list-style: none; margin: 0; padding: 0; display: flex; align-items: flex-end; gap: 6px">
      <li style="flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; gap: 9px">
        <div style="height: 6px; border-radius: 3px; background: {{K.c1}}; opacity: 0.55"></div>
        <div style="display: flex; align-items: center; justify-content: center; gap: 4px; height: 20px; font-size: 14px; font-weight: 600; color: {{K.c2}}; white-space: nowrap">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="{{K.c20}}" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>

        </div>
      </li>
      <li aria-current="step" style="flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; gap: 9px">

            <rect x="-50" y="0" width="50" height="6" fill="url(#stepSheenAsk)"><animate attributeName="x" values="-50;100" dur="1.5s" repeatCount="indefinite"></animate></rect>
          </svg>
        </div>
        <div style="display: flex; align-items: center; justify-content: center; gap: 5px; height: 20px; font-size: 14px; font-weight: 800; letter-spacing: -0.03em; color: {{K.c3}}; white-space: nowrap">
          <svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="4" fill="{{K.c22}}" fill-opacity="0.3"><animate attributeName="r" values="4;8;4" dur="1.4s" repeatCount="indefinite"></animate><animate attributeName="fill-opacity" values="0.35;0;0.35" dur="1.4s" repeatCount="indefinite"></animate></circle><circle cx="8" cy="8" r="4" fill="{{K.c22}}"></circle></svg>

        <div style="height: 6px; border-radius: 3px; background: {{K.c4}}"></div>

    <sc-if value="{{c3}}" hint-placeholder-val="{{ false }}">

    <div style="font-size: 34px; line-height: 1.15; font-family: 'Jua', 'Pretendard', sans-serif; font-weight: 400; letter-spacing: -0.01em; color: {{K.c3}}; margin-top: 4px">하나만 물어볼게요!</div>

어떤 날짜예요?</h1>
    <div style="font-size: 14px; font-weight: 500; color: {{K.c13}}; margin-top: 8px">모르면 그대로 둘게요. 없는 값을 채우지 않아요</div>
  </main>

  <div role="group" aria-label="날짜 종류" style="display: flex; flex-direction: column; gap: 10px; padding: 16px 20px 0">
    <a href="{{links.result}}" style="display: flex; align-items: center; gap: 12px; height: 60px; box-sizing: border-box; padding: 0 18px; border-radius: 20px; background: {{K.c14}}; border: 2px solid {{K.c15}}; color: {{K.c0}}; text-decoration: none; box-shadow: 0 8px 20px {{K.c16}}; {{K.fxc}}">

      <span style="flex-grow: 1; font-size: 17px; font-weight: 700">소비기한</span>
      <span style="font-size: 13px; font-weight: 600; color: {{K.c13}}">“소비기한이야”</span>
    </a>
    <a href="{{links.result}}" style="display: flex; align-items: center; gap: 12px; height: 60px; box-sizing: border-box; padding: 0 18px; border-radius: 20px; background: {{K.c18}}; border: 1px solid {{K.c8}}; color: {{K.c0}}; text-decoration: none; box-shadow: 0 6px 18px {{K.c11}}; {{K.fxc}}">
      <span style="width: 22px; height: 22px; box-sizing: border-box; border-radius: 50%; border: 2px solid {{K.c19}}; flex-shrink: 0"></span>
      <span style="flex-grow: 1; font-size: 17px; font-weight: 700">유통기한</span>
    </a>
    <a href="{{links.result}}" style="display: flex; align-items: center; gap: 12px; height: 60px; box-sizing: border-box; padding: 0 18px; border-radius: 20px; background: {{K.c18}}; border: 1px solid {{K.c8}}; color: {{K.c0}}; text-decoration: none; box-shadow: 0 6px 18px {{K.c11}}; {{K.fxc}}">
      <span style="width: 22px; height: 22px; box-sizing: border-box; border-radius: 50%; border: 2px solid {{K.c19}}; flex-shrink: 0"></span>
      <span style="flex-grow: 1; font-size: 17px; font-weight: 700">잘 모르겠어요</span>
      <span style="font-size: 13px; font-weight: 600; color: {{K.c13}}">미확인으로 둘게요</span>
    </a>
  </div>

  <div style="display: flex; align-items: center; justify-content: center; gap: 10px; padding: 16px 20px 8px">
    <svg width="36" height="36" viewBox="0 0 36 36" aria-hidden="true">
      <circle cx="18" cy="18" r="15" fill="none" stroke="{{K.c23}}" stroke-width="3.5"></circle>
      <circle cx="18" cy="18" r="15" fill="none" stroke="{{K.c24}}" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="94.2" stroke-dashoffset="18.8" transform="rotate(-90 18 18)"></circle>
      <text x="18" y="23" text-anchor="middle" font-size="14" font-weight="800" fill="{{K.c0}}" font-family="Pretendard, sans-serif">8</text>
    </svg>
    <span style="font-size: 14px; font-weight: 600; color: {{K.c6}}">8초 동안은 부르지 않고 바로 말해도 돼요</span>
  </div>
</div>
