  :root { --bg: #1D221F; --panel: #262C28; --text: #EFEBE1; --muted: #A9AFA7; --green: #7CC49A; --warn: #E8A87C; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: 'Pretendard', 'Apple SD Gothic Neo', sans-serif; word-break: keep-all; }
  .wrap { display: grid; grid-template-columns: 1fr 340px; gap: 20px; padding: 20px; min-height: 100vh; }
  header { grid-column: 1 / -1; display: flex; align-items: baseline; gap: 18px; flex-wrap: wrap; }
  h1 { margin: 0; font-size: 34px; font-weight: 750; letter-spacing: -0.02em; }
  .pos { font-size: 20px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .panel { background: var(--panel); border-radius: 16px; padding: 18px 22px; }
  .panel h2 { margin: 0 0 10px; font-size: 16px; font-weight: 700; color: var(--muted); }
  .script p { margin: 0 0 14px; font-size: 26px; line-height: 1.55; }
  .script p.cue { font-size: 19px; font-weight: 650; color: var(--green); }
  .script kbd { display: inline-block; min-width: 64px; padding: 2px 10px; margin-right: 6px; border-radius: 8px; background: #2E6A4E; color: #fff; font: inherit; text-align: center; }
  .notes li, .steps li { font-size: 18px; line-height: 1.55; margin-bottom: 6px; color: #DCD8CE; }
  .notes ul, .steps ul { margin: 0; padding-left: 20px; }
  .steps li.done { color: var(--muted); text-decoration: line-through; }
  .steps li.now { color: var(--green); font-weight: 700; }
  aside { display: flex; flex-direction: column; gap: 16px; }
  .clock { font-size: 44px; font-weight: 750; font-variant-numeric: tabular-nums; }
  .clock small { display: block; font-size: 16px; font-weight: 500; color: var(--muted); }
  .over { color: var(--warn); }
  .next { font-size: 22px; font-weight: 650; margin: 0; }
  .status { font-size: 17px; margin: 0; }
  .ok { color: var(--green); } .bad { color: var(--warn); }
  .buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  button { font: inherit; font-size: 18px; padding: 12px; border-radius: 10px; border: 0; background: #3A423D; color: var(--text); cursor: pointer; }
  button.primary { grid-column: 1 / -1; background: #2E6A4E; font-weight: 700; }
  button:focus-visible { outline: 3px solid var(--green); outline-offset: 2px; }
  .keys { font-size: 14px; color: var(--muted); line-height: 1.6; }
  .main { display: flex; flex-direction: column; gap: 16px; }
</style>

<script>
(() => {
  'use strict';
  const notes = window.DECK_NOTES || [];
  // 목표 합계는 장별 budget의 합. 리허설 전 추정치다.
  const TOTAL_BUDGET = notes.reduce((sum, n) => sum + (n.budget || 0), 0);
  const $ = (id) => document.getElementById(id);

  let state = null;
  let startedAt = null;
  let slideStartedAt = Date.now();
  let lastIndex = -1;

  const fmt = (sec) => {
    const s = Math.max(0, Math.floor(sec));
    return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
  };

  // 청중 화면(이 창을 연 창)에 명령을 보낸다. file:// 에서도 창 참조 postMessage는 동작한다.
  function send(action) {
    const deck = window.opener;
    if (!deck || deck.closed) {
      $('pos').textContent = '청중 화면과 연결이 끊겼습니다. 청중 화면에서 P를 다시 누르세요';
      return;
    }
    deck.postMessage({ type: 'cmd', action }, '*');
  }

  function list(el, items, cls) {
    el.replaceChildren(...items.map((text, i) => {
      const li = document.createElement('li');
      li.textContent = text;
      if (cls) li.className = cls(i);
      return li;
    }));
  }

  function show(next) {
    state = next;
    const n = notes[state.index] || { title: '', script: [], notes: [], steps: [] };
    if (state.index !== lastIndex) {
      lastIndex = state.index;
      slideStartedAt = Date.now();
    }
    $('title').textContent = `${state.index + 1}. ${n.title}`;
    $('pos').textContent = `${state.index + 1} / ${state.total}   단계 ${state.step} / ${state.steps}`;
    list($('steps'), n.steps || [], (i) => (i < state.step ? 'done' : i === state.step ? 'now' : ''));
    $('script').replaceChildren(...(n.script || []).map((t) => {
      const p = document.createElement('p');
      if (typeof t === 'string') {
        p.textContent = t;
        return p;
      }
      // 키 입력 줄: 누를 키와 화면에 일어나는 일
      p.className = 'cue';
      const k = document.createElement('kbd');
      k.textContent = t.key;
      p.append(k, ` ${t.act}`);
      return p;
    }));
    list($('notes'), n.notes || []);
    const after = notes[state.index + 1];
    $('next').textContent = after ? `${state.index + 2}. ${after.title}` : '마지막 장';
  }

  function tick() {
    const n = state ? notes[state.index] : null;
    const budget = n ? n.budget : 0;
    const slideSec = (Date.now() - slideStartedAt) / 1000;
    const totalSec = startedAt ? (Date.now() - startedAt) / 1000 : 0;
    $('slide-clock').innerHTML = `${fmt(slideSec)}<small>이 장 / 목표 ${fmt(budget)}</small>`;
    $('slide-clock').classList.toggle('over', budget > 0 && slideSec > budget);
    const totalLabel = startedAt ? `전체 / 목표 ${fmt(TOTAL_BUDGET)} (리허설 전 추정)` : '전체 · 1장에서 발표 시작을 누르세요';
    $('total-clock').innerHTML = `${fmt(totalSec)}<small>${totalLabel}</small>`;
    $('total-clock').classList.toggle('over', totalSec > TOTAL_BUDGET);
  }

  window.addEventListener('message', (e) => {
    if (e.data && e.data.type === 'state') show(e.data);
  });
  document.querySelectorAll('[data-cmd]').forEach((b) => b.addEventListener('click', () => send(b.dataset.cmd)));
  // IMPORTANT: 전체 시간은 버튼으로만 시작한다. 장 이동으로 자동 시작하면 1장 시간이 빠진다.
  $('reset').addEventListener('click', () => {
    startedAt = Date.now();
    slideStartedAt = Date.now();
    $('reset').textContent = '시간 다시 재기';
    $('reset').classList.remove('primary');
  });
  document.addEventListener('keydown', (e) => {
    const map = { ArrowRight: 'next', ArrowLeft: 'prev', PageDown: 'forward', PageUp: 'backward', ArrowDown: 'forward', ArrowUp: 'backward' };
    if (e.key === ' ') { e.preventDefault(); send(e.shiftKey ? 'backward' : 'forward'); return; }
    if (map[e.key]) { e.preventDefault(); send(map[e.key]); }
  });

  // 청중 화면을 새로고침해도 다시 연결되도록 주기적으로 상태를 요청한다.
  send('sync');
  setInterval(() => { if (window.opener && !window.opener.closed) window.opener.postMessage({ type: 'cmd', action: 'sync' }, '*'); }, 2000);
  setInterval(tick, 500);
  tick();
})();
</script>
