[project]
name = "today-meal-server"
version = "0.1.0"
description = "오늘 뭐 먹지? 앱 서버 — 음성 명령 해석과 재고 처리"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi (>=0.118,<0.120)",
    "uvicorn[standard] (>=0.37,<0.40)",
    "gunicorn (>=23.0,<24.0)",
    "sqlalchemy[asyncio] (>=2.0.36,<2.1)",
    # SQLAlchemy async 가 요구한다. extra 로는 해석되지 않아 명시한다.
    "greenlet (>=3.1,<4.0)",
    "asyncpg (>=0.30,<0.31)",
    # Alembic 은 동기 드라이버를 쓴다. 배포 시 upgrade 를 돌리므로 런타임 의존이다.
    "psycopg[binary] (>=3.2,<4.0)",
    "alembic (>=1.14,<2.0)",
    "pydantic (>=2.10,<3.0)",
    "pydantic-settings (>=2.7,<3.0)",
    "loguru (>=0.7,<0.8)",
    "httpx (>=0.28,<0.29)",
]

[tool.poetry]
packages = [{ include = "app" }]

[tool.poetry.group.dev.dependencies]
pytest = "^8.3"
pytest-asyncio = "^0.25"
ruff = "^0.9"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# 우리 코드의 deprecation 은 실패로 본다. 서드파티 내부 경고는 우리가 고칠 수 없어 제외한다.
filterwarnings = [
    "error::DeprecationWarning",
    "ignore::DeprecationWarning:anyio.*",
    "ignore::DeprecationWarning:starlette.*",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ANN"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN"]
"alembic/*" = ["ANN", "E501"]

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"
